<script>
const DATA={"areas":[{"n":1,"title":"Conceptual Foundations","w":10,"ksas":["101 Datums, coordinate systems & projections","102 Discrete features vs continuous phenomena","103 Earth geometry & its approximations","104 Basic geomatics & its relationship to GIS"],"ideas":[["Datum","the reference model (ellipsoid + origin + orientation) that anchors coordinates to the Earth. Change the datum and the coordinates change, even for the same point (NAD27 to NAD83 can shift points tens of metres)."],["Earth models","Sphere (simple) → Ellipsoid / spheroid (mathematical, flattened at the poles) → Geoid (equal-gravity surface ≈ mean sea level, irregular)."],["Heights","Orthometric height H = h − N (h = ellipsoid height from GPS, N = geoid height). GPS gives ellipsoid heights; maps usually show orthometric (sea-level) heights."],["Geographic vs projected","Geographic coordinate system = latitude/longitude in angular units (degrees). Projected coordinate system = flat x,y in linear units (metres or feet)."],["Projections","No flat map keeps everything. Conformal keeps shape/angles (Mercator, Transverse Mercator, Lambert Conformal Conic). Equal-area keeps area (Albers, Lambert Azimuthal Equal-Area). Equidistant keeps distance from certain points. Azimuthal keeps direction from the centre."],["UTM","60 zones, each 6° of longitude wide, Transverse Mercator, units = metres, false easting 500,000 m, scale factor 0.9996 on the central meridian."],["State Plane (SPCS)","US system, units in feet or metres. Transverse Mercator for zones long north–south; Lambert Conformal Conic for zones long east–west."],["Discrete vs continuous","Discrete = clear boundaries, countable objects (parcels, roads, zoning, soil classes) → usually vector. Continuous = a value everywhere (elevation, temperature, rainfall) → usually raster or TIN."],["Geomatics","Surveying, geodesy, GNSS, photogrammetry, remote sensing and cartography. Legal boundary determination belongs to licensed surveyors, not GIS staff."]],"terms":[["Ellipsoid (spheroid)","Smooth mathematical shape of the Earth (e.g., GRS80, WGS84, Clarke 1866)."],["Geoid","Gravity-based surface close to mean sea level; used for heights."],["Horizontal datum","Reference for lat/long: NAD27, NAD83, WGS84."],["Vertical datum","Reference for heights: NGVD29, NAVD88."],["Datum transformation","Math to move coordinates between datums (e.g., NADCON, NTv2)."],["Graticule","Grid of latitude and longitude lines."],["Central meridian","Line of longitude at the centre of a projection/zone."],["False easting / northing","Values added so coordinates stay positive."],["Tangent vs secant","Projection surface touches the globe at one line (tangent) or cuts it at two (secant, less distortion)."],["Developable surface","Cylinder, cone or plane used to flatten the globe."],["Tissot's indicatrix","Circles drawn on a map to show projection distortion."],["Great circle","Shortest route between two points on a sphere."],["Rhumb line (loxodrome)","Line of constant compass bearing; straight on Mercator."],["Web Mercator (EPSG:3857)","Projection used by web maps; bad for measuring area."],["EPSG / WKID","Numeric code that identifies a coordinate system."],["Decimal degrees (DD)","DD = D + M/60 + S/3600."],["PLSS","US Public Land Survey System: township 6×6 miles = 36 sections; 1 section = 1 sq mile = 640 acres."],["COGO","Coordinate geometry: building features from bearings and distances."],["Metes and bounds","Legal description using bearings, distances and landmarks."]],"traps":["UTM is in METRES, not degrees. Lat/long is in DEGREES, not metres.","Changing the datum changes coordinate values — never assume NAD27 = NAD83 = WGS84.","Elevation and temperature are continuous; soils and zoning are discrete."],"lessons":["Data in a UTM zone → expect metres.","35°15′ → 35 + 15/60 = 35.25 decimal degrees.","Converting NAD27 ↔ NAD83 → coordinate values will not stay the same.","Discrete raster examples → soils and zoning (not elevation or temperature)."]},{"n":2,"title":"Geospatial Data Fundamentals","w":15,"ksas":["201 Spatial data models & planar geometries","202 Spatial data relationships","203 Data quality","204 Data resolution","205 Data validation & uncertainty","206 Metadata","207 Temporal data","208 Standards: ISO, FGDC, OGC"],"ideas":[["Data models","Vector = points, lines, polygons built from vertices and nodes. Raster = grid of cells, one value per cell, cell size = resolution. TIN = triangles joining IRREGULARLY spaced points (Delaunay), great for terrain."],["Topology","Rules about how features share geometry: adjacency, connectivity, containment. Typical rules: polygons must not overlap, must not have gaps, lines must not intersect or self-overlap, no dangles."],["Spatial relationships","Intersects, touches, contains, within, crosses, overlaps, disjoint, equals (formalised by the DE-9IM model)."],["Data quality elements (ISO/FGDC)","Positional accuracy, attribute (thematic) accuracy, logical consistency, completeness, temporal accuracy, lineage."],["Accuracy vs precision","Accuracy = close to the true value. Precision = repeatable / fine detail. Data can be precise but wrong."],["QA vs QC","QA = preventive process BEFORE/while collecting (standards, policies, procedures, training). QC = checking the PRODUCT after (inspections, automated topology checks, comparison to imagery)."],["Accuracy standards","RMSE = √(Σ error² / n). NSSDA reports accuracy at 95% confidence (horizontal = 1.7308 × RMSEr; vertical = 1.9600 × RMSEz). NMAS (1947): 90% of test points within 1/30 inch (scales larger than 1:20,000) or 1/50 inch (smaller scales)."],["Scale & resolution","Large scale (1:1,200) = small area, lots of detail. Small scale (1:1,000,000) = large area, little detail, MORE error. Raster resolution types: spatial, spectral, radiometric, temporal."],["Metadata","Data about data. FGDC CSDGM sections: identification, data quality, spatial data organisation, spatial reference, entity & attribute, distribution, metadata reference. ISO 19115 = metadata content; ISO 19139 = its XML encoding."],["Temporal data","Store time in a DATE/date-time field (not text). Watch time zones, time steps and snapshot vs event models."],["Standards bodies","ISO/TC 211 writes the ISO 19100 series. FGDC coordinates US federal geodata (NSDI, CSDGM). OGC writes interoperability standards (WMS, WFS, WCS, GML, KML, GeoPackage, Simple Features)."]],"terms":[["Vertex / node","Vertex = any point on a line; node = start/end point or junction."],["Planar topology","Lines that cross must create a node (a problem for bridges/overpasses)."],["Dangle","Line end that does not connect to another line."],["Sliver polygon","Thin unwanted polygon from mismatched boundaries."],["Lineage","History of the data: sources and processing steps."],["Logical consistency","Data follows its rules (topology, valid values)."],["Completeness","Nothing missing that should be there; no extra features."],["RMSE","Root mean square error: main measure of positional accuracy."],["NSSDA","US standard for reporting positional accuracy at 95%."],["Minimum mapping unit","Smallest area that is mapped as a separate feature."],["Representative fraction","Scale written as 1:24,000."],["MAUP","Modifiable Areal Unit Problem: results change when zone boundaries/sizes change."],["Ecological fallacy","Wrongly applying group (area) statistics to individuals."],["Uncertainty / error propagation","Errors in inputs carry into, and can grow in, outputs."],["Fitness for use","Is the data good enough for THIS purpose?"],["CSDGM","FGDC Content Standard for Digital Geospatial Metadata."],["ISO 19115 / 19139","ISO metadata standard / its XML implementation."],["ISO 19157","ISO standard for data quality."],["NSDI","US National Spatial Data Infrastructure (led by FGDC)."],["Simple Features","OGC/ISO standard geometry model (point, linestring, polygon)."]],"traps":["A TIN uses IRREGULARLY spaced points; a raster uses a regular grid.","Writing standards and procedures = QA. Running checks on finished data = QC.","Smaller scale → larger error. A 1:100,000 source cannot support parcel-level accuracy.","If 95% of errors are below 20 m, then 5% of errors are above 20 m."],"lessons":["Streets for an impervious-surface study → model as POLYGONS (they have area).","TIN vs raster → both model surfaces; TIN has irregular sample points.","Topology rule examples → lines must not intersect; polygons must not overlap.","QA example → developing standards, policies and processes for collection.","Core metadata items → points of contact, reference system, use constraints.","Hourly time values → use a Date field type.","FGDC/ISO quality elements → attribute accuracy, lineage, logical consistency."]},{"n":3,"title":"Cartography & Visualization","w":10,"ksas":["301 Graphic representation techniques","302 Map design principles & map elements","303 Surface interpretation & representation","304 2D and 3D visualization"],"ideas":[["Levels of measurement","Nominal (names/categories), ordinal (ranked), interval (no true zero, e.g., °C), ratio (true zero, e.g., population, distance)."],["Visual variables","Position, size, shape, colour value (lightness), colour hue, orientation, texture. Hue → categories. Value/lightness → order. Size → quantities."],["Thematic maps","Choropleth = shaded areas, use NORMALISED data (rates, densities, %). Proportional/graduated symbols = raw counts. Dot density, isarithmic (contours), dasymetric, flow, cartogram, heat map."],["Colour schemes","Sequential (low→high), diverging (around a meaningful midpoint), qualitative (categories). RGB = screens (additive); CMYK = print (subtractive). Choose colour-blind-safe palettes."],["Essential map elements","Title, legend, scale (bar, RF or verbal), north arrow, data source/credits, projection, author and date, neatline, inset/locator map."],["Design principles","Visual hierarchy (most important = most prominent), figure–ground, balance, contrast, simplicity, legibility."],["Typography conventions","Water features in BLUE ITALIC. Use different fonts for physical vs cultural features. Point labels best at upper right. Do not use tiny fonts; resize text for web vs print."],["Surfaces","Contour lines (close together = steep), hillshade (default light azimuth 315°, altitude 45°), slope, aspect, hypsometric tint, wireframe, profile (elevation along a line), viewshed. DEM = bare earth; DSM = with buildings/trees."],["2D vs 3D","2.5D = one z value per x,y (surfaces). True 3D = multiple z values (buildings, geology). 3D adds realism but causes hidden areas (occlusion) and perspective distortion; vertical exaggeration makes relief visible."]],"terms":[["Visual hierarchy","Ordering map elements by importance through size, weight and contrast."],["Figure–ground","Making the subject stand out from the background."],["Choropleth map","Areas shaded by a value; needs normalised data."],["Graduated symbol","Symbols in size classes for quantities."],["Proportional symbol","Symbol size directly proportional to the value."],["Dot density","Each dot = a set number of items."],["Isarithmic / isoline","Lines of equal value (contours, isotherms)."],["Dasymetric map","Refines a choropleth using ancillary data (e.g., only populated land)."],["Cartogram","Areas resized by a variable (e.g., population)."],["Contour interval","Elevation difference between neighbouring contour lines."],["Index contour","Darker labelled contour every 4th or 5th line."],["Hillshade","Shaded relief from an imaginary light source."],["Aspect","Compass direction a slope faces."],["Profile","Cross-section graph of elevation along a line."],["Viewshed","Area visible from an observer point."],["Vertical exaggeration","Stretching z values so relief is easier to see."],["Neatline","Border that frames the map."],["Inset / locator map","Small map showing detail or the wider location."]],"traps":["Never make a choropleth of raw totals (e.g., total crimes) — normalise first.","'Network' is NOT a surface representation; contour, shaded relief, wireframe are.","Use a PROFILE to see elevation change along a line, not aspect."],"lessons":["Ordering symbols by intellectual importance → visual hierarchy.","Font conventions → blue italics for water; different fonts for physical vs cultural.","Not a surface map type → network.","Elevation change along a polyline → profile."]},{"n":4,"title":"Data Acquisition","w":11,"ksas":["401 Digitising & manual collection/conversion","402 Field data collection","403 Automated collection & conversion","404 Remotely sensed data","405 Crowdsourced & open-source data and services"],"ideas":[["Digitising","Heads-up (on-screen over imagery) or tablet digitising. Use snapping and tolerances. Common errors: overshoot, undershoot (dangle), sliver, spike, duplicate lines."],["COGO","For legal descriptions (bearings and distances) use coordinate geometry — not heads-up digitising."],["Geocoding","Turning addresses into points using an address locator; reference data and match rate matter; address-range interpolation places points along streets."],["GNSS","GPS (USA), GLONASS (Russia), Galileo (EU), BeiDou (China). Need 4 satellites for a 3D position (x, y, z + clock). Errors: atmosphere (ionosphere/troposphere), multipath, clocks, orbits, poor geometry (high PDOP = bad). Improve with DGPS, RTK (cm-level, base station), SBAS/WAAS, post-processing, CORS."],["Remote sensing","Passive sensors record reflected/emitted energy (optical, multispectral, hyperspectral, thermal). Active sensors send their own energy (radar/SAR, lidar, sonar). Vegetation reflects strongly in near-infrared → NDVI = (NIR − Red)/(NIR + Red)."],["Four resolutions","Spatial (cell size), spectral (number/width of bands), radiometric (bit depth), temporal (revisit time)."],["Aerial imagery","Vertical vs oblique (oblique shows building sides; scale changes across the image; relief visible but distorted; hard to measure). Orthophoto = corrected for tilt and relief displacement → uniform scale. Stereo overlap ≈ 60% forward, 30% side. Photo scale = f / (H − h)."],["Lidar","Laser pulses → point cloud (LAS/LAZ) with multiple returns; first return = canopy/roofs, last return ≈ ground. Builds DEMs, DSMs, canopy height."],["Image classification","Supervised (you give training samples), unsupervised (computer clusters), object-based. Accuracy via confusion (error) matrix: overall accuracy, kappa, producer's accuracy (omission), user's accuracy (commission). TIME OF YEAR matters (leaf-on vs leaf-off)."],["UAS (drones)","Cheap, high-resolution, flexible. Limits: battery / platform range, airspace rules and permission to fly, weather, large data storage, processing time. Structure-from-Motion (SfM) makes 3D models; use ground control points."],["Crowdsourced / open data","VGI such as OpenStreetMap: free and current but variable quality and completeness. Licences often REQUIRE ATTRIBUTION (some require share-alike)."]],"terms":[["Heads-up digitising","Tracing features on screen over a background image."],["Snapping tolerance","Distance within which vertices join automatically."],["Overshoot / undershoot","Line passes / stops short of where it should connect."],["Vectorisation","Converting scanned raster lines into vector features."],["Address locator","Reference data + rules used to geocode addresses."],["PDOP","Positional dilution of precision; lower = better satellite geometry."],["Multipath","GNSS signal bouncing off buildings/surfaces before reaching receiver."],["RTK","Real-Time Kinematic GNSS with a base station; centimetre accuracy."],["DGPS","Differential GPS: corrections from a known base station."],["Multispectral / hyperspectral","A few broad bands / hundreds of narrow bands."],["NDVI","Vegetation index from red and near-infrared bands."],["SAR","Synthetic Aperture Radar; works through clouds and at night."],["Orthorectification","Removing tilt and terrain distortion from imagery."],["Relief displacement","Tall objects lean outward from the image centre."],["Point cloud","Millions of x,y,z points (lidar or photogrammetry)."],["Ground control point (GCP)","Surveyed point used to correct or georeference imagery."],["Confusion matrix","Table comparing classified vs reference classes."],["VGI","Volunteered Geographic Information (e.g., OpenStreetMap)."]],"traps":["4 satellites (not 3) for a 3D GPS fix.","Oblique images are NOT easy to measure and do NOT have uniform scale.","The main limit of open data is usually ATTRIBUTION requirements.","Integration with GIS software is NOT a real UAS limitation; range, permissions, storage and processing cost are."],"lessons":["Legal property description → coordinate geometry (COGO).","Minimum satellites for exact 3D GPS → 4.","Forest mapping from imagery → time of year is most critical.","Oblique imagery → relief visible but distorted.","UAS limitation → limited platform range.","Open-source data limitation → attribution."]},{"n":5,"title":"Data Manipulation","w":11,"ksas":["501 Georeferencing, format conversion & transformation","502 Generalisation operations & methods","503 Spatial file types, uses & limits","504 Data integration"],"ideas":[["Georeferencing","Give an image/scan real-world coordinates using control points (links). Check the RMS error of the links. Transformations: 1st-order polynomial/affine (min 3 points), 2nd-order (min 6), 3rd-order (min 10), spline/rubber-sheeting (local, exact at control points), projective, similarity."],["Resampling","Nearest neighbour → categorical/discrete data (land cover) because values are not changed. Bilinear interpolation and cubic convolution → continuous data (elevation, imagery)."],["Conversion","Vector → raster: CELL SIZE is the first decision (controls accuracy and file size). Raster → vector can create stair-step edges. Every conversion may lose information."],["Spatial adjustment","Rubber-sheeting (stretch data to fit), edge-matching (align features across sheet edges), conflation (combine best geometry and attributes from two datasets)."],["Generalisation operators","Simplification (remove vertices, e.g., Douglas–Peucker), smoothing, aggregation, amalgamation, collapse (polygon → point/line), merge, displacement, exaggeration, selection/elimination, typification, classification. Raster: resample to a bigger cell, majority filter."],["File formats","Shapefile (.shp/.shx/.dbf/.prj; 2 GB limit, 10-character field names, no topology, poor null support). File geodatabase. GeoPackage (OGC, SQLite, open). GeoJSON (web, WGS84 lon/lat). KML/KMZ (Google Earth, WGS84). GML (OGC XML). DXF/DWG (CAD: limited attributes). CSV (XY tables). GeoTIFF, JPEG2000, MrSID, ECW (imagery). LAS/LAZ (lidar). NetCDF/HDF (multidimensional science data)."],["XML / JSON","XML uses custom tags to describe and exchange data structure (including parts of database schemas). JSON is lighter and common in web APIs."],["Data integration","Bring all layers to the same coordinate system and datum, check scale and accuracy, map schemas (field matching), ETL (extract–transform–load). The result is only as good as the LEAST accurate input."],["File-naming best practice","No spaces or special characters; use underscores; keep names short and meaningful."]],"terms":[["Control points / links","Matching source and map locations used to georeference."],["Affine transformation","1st-order: shift, rotate, scale, skew; needs 3+ points."],["Rubber-sheeting","Non-uniform stretching to fit known points."],["Edge-matching","Aligning features across adjacent map sheets/datasets."],["Conflation","Merging two datasets into one better dataset."],["Nearest neighbour","Resampling that keeps original values (categories)."],["Bilinear / cubic convolution","Resampling that averages values (continuous data)."],["Douglas–Peucker","Classic line-simplification algorithm."],["Aggregation","Grouping small features into a larger one."],["Collapse","Reducing dimension: area → line or point."],["Displacement","Moving features apart so they do not overlap at small scale."],["World file","Small text file (.tfw, .jgw) holding image georeferencing."],["GeoPackage","Open OGC SQLite-based format for vector and raster."],["Cloud-Optimised GeoTIFF","GeoTIFF arranged for efficient web streaming."],["Lossless vs lossy","Compression that keeps / discards some data."],["ETL","Extract, Transform, Load workflow for data integration."],["Schema mapping","Matching fields from one data model to another."]],"traps":["Land cover / soils raster → NEAREST NEIGHBOUR resampling.","Vector → raster: think about CELL SIZE first.","DXF's main GIS limitation = limited attribute data (it CAN be projected and drawn over rasters).","When national roads are offset from local high-res imagery, fix (adjust/digitise) the ROADS — the imagery-derived buildings are more accurate."],"lessons":["Vector Anderson land-cover → raster: consider grid cell size first.","Best practice for data exchange → underscores in file names.","Offset national road layer over municipal imagery → adjust or digitise the roads.","DXF limitation → limited attribute data.","XML → enables sharing/exchange of portions of database schemas."]},{"n":6,"title":"Analytical Methods","w":11,"ksas":["601 Data selection queries & views","602 Data classification","603 Analytical operations & methods","604 Map algebra","605 Descriptive & spatial statistics"],"ideas":[["Queries","Attribute query = SQL WHERE clause. Spatial query = select by location (intersect, within distance, contain). SQL wildcards: % = any number of characters, _ = one character, used with LIKE. 'BestHotel%' = starts with BestHotel; '%Park%' = contains Park. Also AND, OR, NOT, IN, BETWEEN, IS NULL. A VIEW = saved virtual table from a query."],["Classification methods","Equal interval (same range per class), quantile (same COUNT per class), natural breaks/Jenks (groups similar values, minimises within-class variance), standard deviation (distance from mean), geometric interval, manual/defined interval. The method can change the story the map tells."],["Vector overlay","Intersect (only common area), union (everything from both), identity (all of input + overlaps), clip (cut to boundary, keep input attributes), erase/difference, symmetrical difference. Use the same coordinate system; expect sliver polygons; output accuracy depends on input accuracy."],["Other tools","Buffer, dissolve, merge/append, spatial join, near/proximity, Thiessen (Voronoi) polygons, kernel density, viewshed, hydrology (fill, flow direction, flow accumulation, watershed), cost distance, suitability (weighted overlay)."],["Network analysis","Shortest/fastest route (Dijkstra), service area, closest facility, location–allocation, OD cost matrix. Needs a connected network with impedance (time/length)."],["Interpolation","IDW (nearer points count more), kriging (geostatistical, uses semivariogram, gives error surface), spline (smooth surface through points), natural neighbour, trend surface."],["Map algebra (Tomlin)","LOCAL = cell-by-cell (arithmetic + − × ÷, relational > < =, Boolean AND/OR/NOT). FOCAL = moving neighbourhood window (mean filter, slope). ZONAL = statistics per zone. GLOBAL = whole raster (Euclidean distance, cost distance)."],["Statistics","Descriptive: mean, median, mode, range, variance, standard deviation. Spatial: mean centre, standard distance, standard deviational ellipse, nearest-neighbour index (R < 1 clustered, R ≈ 1 random, R > 1 dispersed), Moran's I (+ clustered, 0 random, − dispersed), Getis-Ord Gi* (hot/cold spots), Ripley's K, OLS and GWR regression."],["Key formulas","Distance d = √((x₂ − x₁)² + (y₂ − y₁)²). RMSE = √(Σ d² / n). Tobler's First Law: near things are more related than distant things (spatial autocorrelation)."]],"terms":[["WHERE clause","Condition part of an SQL query."],["LIKE + %","Wildcard text match (any characters)."],["View","Stored query that behaves like a table."],["Definition query","Filter limiting which features a layer shows."],["Quantile","Equal number of features in each class."],["Natural breaks (Jenks)","Classes at natural gaps in the data."],["Normalisation","Dividing by area or total to make fair comparisons."],["Buffer","Zone at a set distance around features."],["Dissolve","Merging features that share an attribute value."],["Spatial join","Transferring attributes based on location."],["Thiessen / Voronoi","Polygons of area closest to each point."],["Kernel density","Smooth surface showing concentration of points."],["IDW","Inverse distance weighted interpolation."],["Kriging / semivariogram","Geostatistical interpolation / its spatial-correlation model."],["Focal (neighbourhood)","Operation using a moving window of cells."],["Zonal","Operation summarising values within zones."],["Relational / logical operator","Compare cells (>, <, =) or combine (AND, OR) → true/false output."],["Moran's I","Global measure of spatial autocorrelation."],["Getis-Ord Gi*","Hot-spot / cold-spot statistic."],["z-score / p-value","How unusual a result is / chance it is random."]],"traps":["In SQL, the wildcard is % with LIKE (not = and not *).","Relational (>, <) and Boolean (AND/OR) map algebra output 1/0 rasters.","Lower RMSE = MORE accurate. Compute it: √(sum of squares ÷ n).","Overlay results are only as good as the input layers and the business accuracy need."],"lessons":["Names starting with 'BestHotel' → LIKE 'BestHotel%'.","Seismic + flood overlay → accuracy from inputs, sliver polygons, same coordinate system.","Soils × parcels overlay → understand each layer's accuracy and the required accuracy.","√((x₂−x₁)² + (y₂−y₁)²) → distance between locations.","Raster comparison producing true/false → relational/logical map algebra.","RMSE: 100 obs, Σ=400 → 2; 10 obs, Σ=90 → 3 → first sample is more accurate."]},{"n":7,"title":"Database Design & Management","w":10,"ksas":["701 Relationships among database objects","702 Database design","703 Database management & administration","704 Data security"],"ideas":[["Table parts","Field/column (data type, length, constraints), record/row (= tuple), primary key (unique, not null), foreign key (links to another table's key)."],["Cardinality","One-to-one, one-to-many, many-to-many. Many-to-many needs an associative (junction) table."],["Join vs relate","JOIN appends attributes into one table (1:1 or many:1). RELATE keeps tables separate and linked (1:M or M:N). APPEND adds rows to an existing table with the same schema. MERGE combines inputs into a new dataset. UNION is an overlay."],["Design stages","Conceptual (entities and relationships, E-R diagram) → logical (tables, keys, normalisation) → physical (actual DBMS, data types, indexes, storage)."],["Normalisation","1NF = atomic values, no repeating groups. 2NF = no partial dependency on part of a composite key. 3NF = no transitive dependency (non-key depends on non-key). Denormalise only for performance."],["Integrity tools","Domains (coded-value lists or ranges) stop typing errors, default values, subtypes, relationship classes, attribute rules, topology, NOT NULL constraints."],["Administration","Versioning (many editors; reconcile and post; resolve conflicts), replication (copies for remote/satellite offices: one-way, two-way, check-out), archiving/history, backups (full, incremental, differential), indexing (attribute and spatial: R-tree, quadtree, grid), transactions (ACID), locking."],["SQL families","DDL = CREATE, ALTER, DROP (structure). DML = SELECT, INSERT, UPDATE, DELETE (data). DCL = GRANT, REVOKE (permissions)."],["Security","Authentication (who you are) vs authorisation (what you can do). Roles, least privilege, encryption at rest and in transit, audit logs, protect personal data (PII). CIA triad = confidentiality, integrity, availability."]],"terms":[["Primary key","Field that uniquely identifies each record."],["Foreign key","Field that refers to a primary key in another table."],["Composite key","Primary key made of 2+ fields."],["Cardinality","How many records relate to how many (1:1, 1:M, M:N)."],["Associative table","Junction table that resolves a many-to-many link."],["E-R diagram","Entity–Relationship model drawing."],["Data dictionary","List of tables, fields, types and meanings."],["Schema","Structure of the database (tables, fields, rules)."],["Domain","Allowed values for a field (list or range)."],["Subtype","Sub-category within a feature class with its own defaults."],["Versioning","Multi-user editing with separate versions."],["Reconcile & post","Merge edits from a version back to the parent."],["Replication","Synchronised copies of a database in other places."],["Spatial index","Structure that speeds up location-based searches."],["ACID","Atomicity, Consistency, Isolation, Durability of transactions."],["DBMS / RDBMS","Database management system (Oracle, SQL Server, PostgreSQL+PostGIS)."],["Least privilege","Give users only the access they need."]],"traps":["Many-to-many = RELATE (not join).","To stop spelling mistakes in an attribute → DOMAIN (not spell check, not default value).","Slow access from a satellite office → database REPLICATION.","Data-type constraints live in the FIELDS."],"lessons":["Combine two tables' information into Table 1 → join.","Where are data-type constraints → fields.","Many-to-many tables → relate.","Prevent spelling errors in zoning field → domain.","Satellite-office performance problem → database replication."]},{"n":8,"title":"Application Development","w":7,"ksas":["801 Data transfer protocols","802 Coding, scripting & modelling basics","803 Basic application development methods"],"ideas":[["Protocols","HTTP (web), HTTPS (web + TLS encryption — secure AND widely accessible), FTP/SFTP/FTPS (file transfer), SSH (secure shell), SMTP (email), LDAP (user directories), TCP/IP (base internet protocol)."],["Web service styles","REST = simple, stateless, uses HTTP verbs GET/POST/PUT/DELETE, often JSON. SOAP = XML messages, more formal."],["OGC services","WMS = map pictures. WFS = vector features (WFS-T = editable). WCS = raster coverages. WMTS = cached tiles. WPS = geoprocessing. CSW = catalogue search. OGC API – Features = modern REST/JSON version."],["Exchange approaches","File-based, API, web services, direct database connection. (Native format alone is NOT an exchange approach between dissimilar systems.)"],["Coding basics","Variables, data types, lists/arrays, conditionals (if/else), loops (for/while), functions, classes/objects, comments, pseudocode, debugging (syntax vs logic errors). Interpreted (Python, JavaScript) vs compiled (C#, Java)."],["GIS languages & tools","Python (ArcPy, PyQGIS, GDAL/OGR, GeoPandas, Shapely), JavaScript (Leaflet, OpenLayers, ArcGIS Maps SDK), SQL, R. Visual models: ModelBuilder, QGIS Graphical Modeler, FME."],["Development methods","SDLC: requirements → design → build → test → deploy → maintain. Waterfall = sequential stages. Agile/Scrum = short sprints, user stories, continuous integration and delivery, FREQUENT testing. RAD/prototyping, DevOps. Use version control (Git)."],["Testing","Unit → integration → system → user acceptance testing (UAT)."]],"terms":[["API","Application Programming Interface: rules for programs to talk to each other."],["SDK","Software Development Kit: tools/libraries to build apps."],["REST","Lightweight web-service style using URLs and HTTP verbs."],["JSON / GeoJSON","Lightweight data format / its geographic version."],["TLS / SSL","Encryption behind HTTPS."],["WMS / WFS / WCS","OGC services for maps / features / coverages."],["Pseudocode","Plain-language outline of program logic."],["Loop","Repeats code (for each feature, while condition)."],["Function","Reusable named block of code."],["Object-oriented","Code organised as classes and objects."],["Agile / Scrum / Sprint","Iterative method / framework / short work cycle."],["Waterfall","Step-by-step method; each phase finishes before the next."],["CI / CD","Continuous integration / continuous delivery."],["Version control (Git)","Tracks code changes and enables teamwork."],["UAT","User acceptance testing by real users before release."]],"traps":["'Limited testing' is NOT part of Agile — Agile tests continuously.","Most secure yet widely accessible web protocol → HTTPS.","Read pseudocode slowly: track each variable step by step."],"lessons":["Not an exchange approach between dissimilar systems → native format.","Map extent centred on a point (pseudocode) → extent = offset distance around the input coordinates.","Not associated with Agile → limited testing.","Secure, widely accessible web app protocol → HTTPS."]},{"n":9,"title":"Systems Design & Management","w":7,"ksas":["901 Systems architecture & design (software, platforms, environments)","902 Systems & application security","903 Trends in geospatial technology"],"ideas":[["Architecture","Desktop, client–server (CLIENT requests a service; SERVER provides it), multi-tier (presentation → application/logic → data), web GIS, mobile, enterprise. Thin client (browser) vs thick client (desktop app)."],["Cloud","IaaS (rent servers), PaaS (platform), SaaS (ready software). Public, private, hybrid. Benefits: elastic/scalable deployment, less hardware to buy, easy collaboration. NOT guaranteed security."],["Planning a system","Needs assessment → requirements (functional = what it does; non-functional = speed, security, uptime) → design → pilot → implementation → maintenance. Consider cost–benefit, ROI, capacity, bandwidth, latency, load balancing, high availability, disaster recovery."],["Software options","Commercial (COTS) e.g., Esri ArcGIS, Hexagon, Bentley vs open source e.g., QGIS, GeoServer, PostGIS, GDAL. Consider licensing, support, skills and integration."],["Security","Firewall, DMZ, reverse proxy, VPN, HTTPS certificates, multi-factor authentication, single sign-on (SAML, OAuth 2.0), tokens, role-based access, patching, antivirus, backups, penetration testing. Threats: SQL injection, phishing, malware/ransomware, DDoS."],["Trends","Cloud/SaaS, GeoAI and deep learning, big data, IoT and real-time sensors, digital twins, 3D GIS and BIM, drones, indoor mapping, smart cities, high-precision GNSS, AR/VR/MR."],["Reality types","Augmented reality (AR) = digital info layered on the real view (e.g., headset shows buried pipes in the field). Virtual reality (VR) = fully computer-made world. Mixed reality = digital objects interact with the real world."]],"terms":[["Client","Computer/app that requests a service."],["Server","Computer that provides a service."],["Multi-tier architecture","Separated presentation, logic and data layers."],["IaaS / PaaS / SaaS","Cloud service levels: infrastructure / platform / software."],["Elasticity / scalability","Adding or removing resources as demand changes."],["Virtualisation / containers","Running many systems on shared hardware (VMs, Docker)."],["Load balancer","Spreads traffic across servers."],["Latency / bandwidth","Delay / data capacity of a network."],["Needs assessment","Study of what users need before designing a system."],["Functional requirement","What the system must do."],["Non-functional requirement","How well it must do it (speed, security, uptime)."],["DMZ","Network zone between internet and internal network."],["MFA","Multi-factor authentication (password + code/device)."],["SSO","Single sign-on with one login for many systems."],["Digital twin","Live digital copy of a real asset or city."],["GeoAI","AI/machine learning applied to geospatial data."]],"traps":["Cloud does NOT guarantee security, and it removes (not creates) collaboration barriers.","Headset overlaying underground utilities on the real world → AUGMENTED reality."],"lessons":["Computer requesting a service → client.","Cloud advantages → elastic deployments and reduced hardware purchases.","Field headset with as-built utilities over real view → augmented reality."]},{"n":10,"title":"Professional Practice","w":8,"ksas":["1001 Work-related policies & procedures","1002 Ethics in technical GIS work","1003 Managing, documenting & communicating GIS work","1004 How GIS is used in other professions","1005 GIS professional organisations & certification"],"ideas":[["Policies","Follow your organisation's policies on data sharing, licensing, privacy (PII), public-records/FOIA requests, copyright, disclaimers/liability, records retention and accessibility. When unsure, ask — do not improvise."],["GISCI Code of Ethics","Four obligations: to SOCIETY, to EMPLOYERS and FUNDERS, to COLLEAGUES and the PROFESSION, and to INDIVIDUALS in society. Be honest, never misrepresent data or results, avoid conflicts of interest, protect privacy and confidentiality, credit others' work, document data limits, and work only within your competence."],["Know your limits","Recovering or determining a legal property boundary is LICENSED SURVEYING work — not a GIS professional task. Mapping parcels, school districts and georeferencing for maintenance are GIS tasks."],["Project management","Phases: initiation → planning → execution → MONITORING & CONTROL (throughout ALL stages) → closing. Triple constraint: scope, time, cost. Tools: WBS, Gantt chart, critical path, risk register, change control, communication plan, lessons learned."],["Good data practice","Use AUTHORITATIVE sources, get data directly from the source, document everything with metadata, keep version history, and communicate uncertainty clearly to decision-makers."],["GIS in other fields","Local government (parcels, zoning, permits), utilities, public safety/911/NG911, transportation, natural resources, environment, public health, agriculture, business/retail site selection, insurance, defence/intelligence, archaeology."],["Organisations","GISCI (GISP certification), GPN (formerly URISA), ASPRS (photogrammetry and remote sensing; CMS certifications), NSGIC (state GIS coordinators), UCGIS (GIS&T Body of Knowledge), AAG (geographers), NSPS (surveyors), USGIF (GEOINT), OGC (standards), MAPPS (private mapping firms)."],["GISP requirements","Portfolio (education, experience — at least 4 years, contributions to the profession), sign the Code of Ethics, pass the exam. Recertify every 3 years."]],"terms":[["PII","Personally Identifiable Information; must be protected."],["FOIA / open records","Laws allowing the public to request government data."],["Data-sharing agreement","Contract defining how data may be used and shared."],["Liability disclaimer","Statement limiting responsibility for misuse of data."],["Conflict of interest","Personal interest that could bias professional work."],["Authoritative data","Official data from the responsible source/agency."],["Scope creep","Uncontrolled growth of project requirements."],["WBS","Work Breakdown Structure: project split into tasks."],["Gantt chart","Bar chart schedule of tasks over time."],["Critical path","Longest chain of dependent tasks; sets the finish date."],["Stakeholder","Anyone affected by or interested in the project."],["Lessons learned","Review at project end to improve future work."],["GIS&T Body of Knowledge","UCGIS outline of GIS knowledge; the exam is aligned to it."],["GISP-E / PreGISP","Early-career GISCI credential and exam."]],"traps":["Project monitoring happens during ALL stages, not only at delivery.","For suitability models, identify AUTHORITATIVE data and get it from the source — do not just collect 'everything available'.","Ethics answers: choose honesty and transparency, even when a client or boss prefers another result."],"lessons":["Gathering data for a development-suitability model → identify authoritative information and access it directly from the source.","When to monitor a GIS project → during all stages.","NOT a GIS professional task → acquiring field data to recover a property boundary."]}],"pairs":[["Datum","Projection","Datum = where the coordinates are anchored (Earth model). Projection = how the round Earth is drawn flat."],["Geographic CS","Projected CS","Degrees on a globe vs metres/feet on a flat plane."],["Ellipsoid","Geoid","Smooth math shape vs gravity surface (≈ sea level)."],["Conformal","Equal-area","Keeps shape/angles vs keeps area."],["Large scale","Small scale","1:1,000 (detailed, small area) vs 1:1,000,000 (general, big area)."],["Accuracy","Precision","Close to truth vs repeatable/detailed."],["QA","QC","Prevent errors (process) vs find errors (product)."],["Vector","Raster","Points/lines/polygons vs grid of cells."],["Raster","TIN","Regular cells vs irregular triangles."],["DEM / DTM","DSM","Bare-earth vs top surface including trees and buildings."],["Passive sensor","Active sensor","Uses sun/emitted energy vs sends its own (lidar, radar)."],["Vertical photo","Oblique photo","Straight down, measurable vs angled, distorted, shows facades."],["Supervised","Unsupervised","Classification with training samples vs computer clustering."],["Producer's accuracy","User's accuracy","Omission error (map maker view) vs commission error (map user view)."],["Nearest neighbour","Bilinear/cubic","Categorical data vs continuous data resampling."],["Clip","Intersect","Cut to a boundary (input attributes only) vs keep common area with attributes of both."],["Union","Intersect","Everything from both vs only the overlap."],["Join","Relate","Merge attributes into one table (1:1, M:1) vs keep linked (1:M, M:N)."],["Append","Merge","Add rows into an existing dataset vs create a new combined dataset."],["Equal interval","Quantile","Equal value ranges vs equal number of features."],["Local","Focal","Cell by cell vs moving neighbourhood window."],["Zonal","Global","Statistics per zone vs operation using the whole raster."],["Authentication","Authorisation","Who you are vs what you may do."],["Waterfall","Agile","Sequential phases vs short iterative sprints."],["WMS","WFS","Map images vs actual vector features."],["AR","VR","Digital layer on the real view vs fully virtual world."]],"numbers":[["DMS → decimal degrees","DD = D + M/60 + S/3600   (35°15′ = 35.25°)"],["1° of latitude","≈ 111 km (69 miles). Longitude degrees shrink toward the poles (× cos latitude)."],["UTM","60 zones × 6° • metres • scale factor 0.9996 • false easting 500,000 m"],["GPS 3D position","Minimum 4 satellites (x, y, z + receiver clock)"],["Orthometric height","H = h − N  (ellipsoid height minus geoid height)"],["Distance","d = √((x₂ − x₁)² + (y₂ − y₁)²)"],["RMSE","√( Σ error² ÷ n )"],["NSSDA (95%)","Horizontal = 1.7308 × RMSEr   •   Vertical = 1.9600 × RMSEz"],["NMAS (1947)","90% of points within 1/30 inch (> 1:20,000) or 1/50 inch (≤ 1:20,000)"],["NDVI","(NIR − Red) ÷ (NIR + Red); range −1 to +1, healthy vegetation high"],["Photo scale","f ÷ (H − h)  (focal length ÷ flying height above ground)"],["Polynomial control points","1st order ≥ 3 • 2nd order ≥ 6 • 3rd order ≥ 10"],["Hillshade default","Sun azimuth 315° (NW), altitude 45°"],["Stereo imagery","≈ 60% forward overlap, ≈ 30% side overlap"],["PLSS","Township 6 × 6 mi = 36 sections • section = 640 acres"],["Nearest-neighbour index","R < 1 clustered • R ≈ 1 random • R > 1 dispersed"],["Moran's I","+ clustered • ~0 random • − dispersed"],["Shapefile limits","2 GB per file • 10-character field names"],["Choropleth classes","Usually 5–7 classes"],["GISP","4 yrs experience • exam + portfolio + ethics • recertify every 3 yrs"]],"questions":[["A dataset is stored in WGS 84 geographic coordinates. What are its units?",["Metres","Feet","Decimal degrees","US survey feet"],"C","Geographic coordinate systems use angular units.",1],["Convert 24°30′36″ to decimal degrees.",["24.36","24.51","24.3036","24.50"],"B","24 + 30/60 + 36/3600 = 24 + 0.5 + 0.01 = 24.51.",1],["Which projection property does the Albers projection preserve?",["Shape","Area","Direction from centre","True distance everywhere"],"B","Albers is an equal-area conic projection.",1],["A GPS gives an ellipsoid height of 50 m. The geoid height (N) is −30 m. What is the orthometric height?",["20 m","50 m","80 m","−80 m"],"C","H = h − N = 50 − (−30) = 80 m.",1],["How wide is each UTM zone?",["3° longitude","6° longitude","8° latitude","10° longitude"],"B","60 zones × 6° = 360°.",1],["Which phenomena are continuous? (Select all that apply)",["Precipitation","Land parcels","Elevation","School districts"],"AC","They have a value at every location; parcels and districts are discrete.",1],["Two polygons share a common boundary. Which topological relationship is this?",["Connectivity","Adjacency","Containment","Disjoint"],"B","Adjacency = neighbours sharing an edge.",2],["Which activity is quality CONTROL rather than quality assurance?",["Writing a digitising standard","Training field crews","Running topology checks on the delivered data","Defining a data model before collection"],"C","QC checks the finished product; the others prevent errors (QA).",2],["Which map scale is the LARGEST scale?",["1:1,000,000","1:250,000","1:100,000","1:24,000"],"D","Large scale = smallest denominator = most detail.",2],["Which standard defines geographic metadata content internationally?",["ISO 19115","ISO 9001","OGC WMS","ISO 14001"],"A","ISO 19115 is the metadata standard (ISO 19139 is its XML encoding).",2],["Which statement about accuracy and precision is TRUE?",["Precise data is always accurate","Accurate data is always precise","Data can be precise but inaccurate","They mean the same thing"],"C","Repeated measurements can cluster tightly around the wrong value.",2],["Which is a core element of data quality in ISO/FGDC? (Select all that apply)",["Completeness","Software vendor","Positional accuracy","Lineage"],"ACD","Vendor is not a data quality element.",2],["Which OGC standard returns map IMAGES?",["WFS","WMS","WCS","GML"],"B","WMS = Web Map Service (pictures).",2],["You want to map TOTAL population by county. Which map type is best?",["Choropleth","Proportional symbol","Isarithmic","Dot density with no legend"],"B","Raw counts suit proportional symbols; choropleths need normalised data.",3],["The data shows % change from last year (−20% to +20%). Which colour scheme fits?",["Sequential","Qualitative","Diverging","Single hue random"],"C","Diverging schemes show values above/below a meaningful midpoint (0%).",3],["What does closely spaced contour lines indicate?",["Flat land","Steep slope","Water body","Data error"],"B","Elevation changes quickly over a short distance.",3],["Which visual variable is best for showing CATEGORIES (land-use types)?",["Size","Colour value (lightness)","Colour hue","Graduated symbols"],"C","Hue suits nominal data; value/size imply order or quantity.",3],["NDVI is calculated from which bands?",["Blue and green","Red and near-infrared","Thermal and red","Green and SWIR"],"B","NDVI = (NIR − Red)/(NIR + Red).",4],["Which sensors are ACTIVE? (Select all that apply)",["Lidar","Landsat multispectral","Synthetic aperture radar","Aerial camera"],"AC","Active sensors emit their own energy.",4],["A digitised line stops short of the line it should meet. This is a(n):",["Overshoot","Undershoot","Sliver","Spike"],"B","An undershoot leaves a dangle/gap.",4],["Which GPS technique gives centimetre accuracy in real time using a base station?",["Autonomous GPS","WAAS","RTK","Assisted GPS"],"C","Real-Time Kinematic uses carrier-phase corrections from a base.",4],["For a supervised classification, what must the analyst provide?",["Number of clusters only","Training samples","A DEM","Nothing"],"B","Supervised = analyst-defined training areas.",4],["You are resampling a LAND-COVER raster. Which method should you use?",["Bilinear","Cubic convolution","Nearest neighbour","Spline"],"C","Nearest neighbour keeps the original class codes.",5],["Minimum number of control points for a 1st-order (affine) transformation?",["2","3","6","10"],"B","1st order ≥ 3, 2nd ≥ 6, 3rd ≥ 10.",5],["At small scale, a city polygon is shown as a dot. Which generalisation operator?",["Displacement","Collapse","Smoothing","Exaggeration"],"B","Collapse reduces dimension (area → point).",5],["Which are shapefile limitations? (Select all that apply)",["10-character field names","2 GB file size limit","Cannot store a coordinate system","Does not store topology"],"ABD","The .prj file stores the coordinate system.",5],["Which format is a web-friendly JSON format that normally uses WGS 84 lon/lat?",["GML","GeoJSON","DWG","MrSID"],"B","GeoJSON (RFC 7946) uses WGS 84.",5],["Which SQL finds every name CONTAINING 'Park'?",["Name = 'Park'","Name LIKE 'Park%'","Name LIKE '%Park%'","Name LIKE 'Park'"],"C","% on both sides = any characters before and after.",6],["Which overlay keeps ONLY the area common to both layers?",["Union","Intersect","Erase","Identity"],"B","Intersect outputs only the overlapping area.",6],["A Moran's I value near +1 means:",["Random pattern","Dispersed pattern","Clustered pattern","No data"],"C","Positive spatial autocorrelation = similar values cluster.",6],["Calculating slope from a DEM using a 3×3 window is which map-algebra type?",["Local","Focal","Zonal","Global"],"B","It uses each cell's neighbourhood.",6],["Mean elevation for each watershed is which map-algebra type?",["Local","Focal","Zonal","Global"],"C","Statistics per zone.",6],["Errors at 4 check points are 3, 4, 0 and 5 m. RMSE ≈ ?",["3.0 m","3.5 m","12.5 m","4.0 m"],"B","(9+16+0+25)/4 = 12.5; √12.5 ≈ 3.54 m.",6],["Which interpolation uses a semivariogram and gives a prediction-error surface?",["IDW","Spline","Kriging","Natural neighbour"],"C","Kriging is geostatistical.",6],["The classification that puts the SAME NUMBER of features in each class is:",["Equal interval","Quantile","Natural breaks","Standard deviation"],"B","Quantile = equal count.",6],["Students and classes (each student takes many classes; each class has many students) is:",["1:1","1:M","M:N","M:1"],"C","Many-to-many needs an associative table.",7],["Removing transitive dependencies brings a table to:",["1NF","2NF","3NF","Denormalised form"],"C","3NF = non-key fields depend only on the key.",7],["Multiple editors work at the same time and later 'reconcile and post'. This is:",["Replication","Versioning","Archiving","Indexing"],"B","Versioning supports multi-user editing.",7],["Which SQL command gives a user permission to read a table?",["CREATE","UPDATE","GRANT","SELECT"],"C","GRANT is DCL (data control language).",7],["Which OGC service lets a client EDIT vector features over the web?",["WMS","WMTS","WFS-T","WCS"],"C","WFS-Transactional supports insert/update/delete.",8],["Short iterations called sprints, with continuous testing, describe:",["Waterfall","Agile/Scrum","Big-bang","Spiral only"],"B","Agile works in sprints.",8],["Cloud model where the vendor delivers ready-to-use software through a browser:",["IaaS","PaaS","SaaS","On-premises"],"C","Software as a Service.",9],["Giving users only the minimum access they need is the principle of:",["Least privilege","Single sign-on","Load balancing","Elasticity"],"A","Least privilege limits damage from mistakes or attacks.",9],["A headset shows a fully computer-generated city that replaces the real view. This is:",["Augmented reality","Virtual reality","Mixed reality","Remote sensing"],"B","VR replaces the real world; AR overlays it.",9],["A client asks you to adjust weights so their preferred site ranks first, without justification. You should:",["Adjust quietly","Refuse and report results honestly with documented methods","Delete the analysis","Change the data source"],"B","GISCI ethics require honesty and transparency.",10],["Which organisation publishes the GIS&T Body of Knowledge?",["GISCI","UCGIS","ASPRS","OGC"],"B","UCGIS maintains the GIS&T BoK.",10]]};
/* Lesson schema — supplementary study notes organised by the official GISCI 2019 blueprint (KSAs are official; lesson text, quizzes and demos are supplementary). */
const LESSONS=[
{id:"crs",area:1,ksa:["101","103"],module:"Coordinate Reference Systems",title:"Coordinates on a round Earth",
 concept:["A coordinate reference system (CRS) is the agreement that turns numbers into places. A geographic CRS records position as two angles, latitude and longitude, measured on the ellipsoid of a datum.","A projected CRS flattens that curved surface onto a plane, so positions become x and y in linear units (metres or feet). The Universal Transverse Mercator system (UTM) cuts the world into 60 zones, each 6° of longitude wide, each with its own central meridian and a false easting of 500,000 m.","Every CRS has an identifier, usually an EPSG code, so software can tell exactly which datum, projection and units a dataset uses."],
 formula:[["DD = D + M/60 + S/3600","Degrees–minutes–seconds to decimal degrees"],["zone = ⌊(λ + 180) ÷ 6⌋ + 1","UTM zone from longitude λ (Dubai, 55.3°E → zone 40)"]],
 vocab:[["Latitude","Angle north or south of the equator, from −90° to +90°."],["Longitude","Angle east or west of the prime meridian, from −180° to +180°."],["Graticule","The network of parallels and meridians."],["UTM","60 Transverse Mercator zones, 6° wide, with coordinates in metres."],["EPSG code","A numeric identifier for a coordinate reference system, e.g. 4326 for WGS 84."]],
 predict:{q:"A dataset is stored in UTM Zone 40N. What unit will its coordinates be in?",o:["Decimal degrees","Metres","US survey feet","Radians"],a:"B",ex:"UTM is a projected system: positions are eastings and northings in metres. Degrees belong to geographic coordinate systems."},
 check:[{q:"Which UTM zone contains longitude 55.3°E?",o:["Zone 38","Zone 39","Zone 40","Zone 41"],a:"C",ex:"⌊(55.3 + 180) ÷ 6⌋ + 1 = ⌊39.2⌋ + 1 = 40."},{q:"Convert 25°12′36″ N to decimal degrees.",o:["25.1236","25.21","25.126","25.20"],a:"B",ex:"25 + 12/60 + 36/3600 = 25 + 0.2 + 0.01 = 25.21."}],
 demo:"globe",steps:[["The graticule","Parallels of latitude and meridians of longitude wrap the globe."],["The two origins","The equator (0° latitude) and the prime meridian (0° longitude) are where angles are measured from."],["A position","Dubai sits at about 25.2°N, 55.3°E: two angles measured from the Earth's centre."],["UTM zones","Sixty 6° strips. Dubai falls in zone 40, where coordinates become metres east and north."]]},

{id:"proj",area:1,ksa:["101"],module:"Coordinate Reference Systems & Map Projections",title:"Map projections",
 concept:["A projection transfers the graticule from the globe onto a developable surface: a cylinder, a cone or a plane. Because a sphere cannot be flattened without stretching, every projection distorts something.","Conformal projections (Mercator, Transverse Mercator, Lambert Conformal Conic) keep local angles and shapes. Equal-area projections (Albers, Lambert Azimuthal Equal-Area) keep area. Equidistant projections keep distance from chosen points, and azimuthal projections keep direction from their centre.","Tissot's indicatrix makes distortion visible: identical small circles drawn on the globe become larger, flatter or skewed ellipses on the map."],
 formula:[["y = R · ln tan(π/4 + φ/2)","Mercator northing for latitude φ"],["k = sec φ","Mercator scale factor: 2× at 60°, ~5.8× at 80°"]],
 vocab:[["Conformal","Preserves angles and local shape."],["Equal-area","Preserves the relative size of areas."],["Developable surface","A cylinder, cone or plane that can be unrolled flat."],["Tissot's indicatrix","Circles that reveal a projection's distortion."]],
 predict:{q:"You must compare forest AREA across a whole continent. Which projection fits best?",o:["Mercator","Albers equal-area conic","Web Mercator","Transverse Mercator"],a:"B",ex:"Area comparisons need an equal-area projection. Mercator and Web Mercator inflate areas toward the poles."},
 check:[{q:"Why does Greenland look as large as Africa on a Mercator map?",o:["Mercator is equal-area","Scale grows toward the poles (k = sec φ)","Greenland uses another datum","Mercator is azimuthal"],a:"B",ex:"Mercator is conformal; to keep shapes it stretches scale by sec φ, so high-latitude areas look far too large."}],
 demo:"proj",steps:[["The globe","Amber Tissot circles are all the same size on the globe."],["Onto a cylinder","The graticule is projected onto a cylinder wrapped around the globe."],["Mercator (conformal)","Unrolled: circles stay round but swell toward the poles."],["Equal-area cylindrical","Every circle keeps its area, so shapes near the poles flatten."],["Conic","A cone touches a mid-latitude: low distortion in an east–west band."],["Azimuthal","A plane touches one point. Directions from the centre are true."]]},

{id:"datum",area:1,ksa:["103","104"],module:"GIS Fundamentals & Geodesy",title:"Earth models, datums and heights",
 concept:["Geodesy models the Earth three ways. A sphere is the simplest. An ellipsoid is flattened at the poles and is the mathematical surface that datums such as WGS 84 and NAD83 use. The geoid follows gravity and approximates mean sea level, so it rises and dips relative to the ellipsoid.","A horizontal datum fixes an ellipsoid's size, shape and position. Moving data between datums (NAD27 to NAD83, for example) changes coordinate values and needs a datum transformation.","GNSS receivers measure ellipsoidal height h. Maps and engineering use orthometric height H, measured from the geoid. The geoid separation N links them."],
 formula:[["H = h − N","Orthometric height from ellipsoid height and geoid separation"]],
 vocab:[["Ellipsoid","Smooth mathematical model of the Earth (GRS80, WGS 84)."],["Geoid","Equipotential gravity surface close to mean sea level."],["Datum","Reference that positions an ellipsoid relative to the Earth."],["Orthometric height","Height above the geoid (sea-level height)."]],
 predict:{q:"A GPS gives ellipsoid height h = 50 m where the geoid separation N = −30 m. What is the orthometric height H?",o:["20 m","50 m","80 m","−80 m"],a:"C",ex:"H = h − N = 50 − (−30) = 80 m."},
 check:[{q:"You convert point data from NAD27 to NAD83. What should you expect?",o:["Identical coordinates","Coordinates change; a datum transformation is needed","Only heights change","Only the map projection changes"],a:"B",ex:"The datums use different ellipsoids and origins, so the same ground point has different coordinates."}],
 demo:"earth",steps:[["Sphere","One radius everywhere."],["Ellipsoid","Flattened at the poles (exaggerated here)."],["Geoid","Gravity makes it lumpy: amber above the ellipsoid, blue below."],["Three heights","h above the ellipsoid, N for the geoid, H = h − N above sea level."]]},

{id:"topo",area:2,ksa:["201","202"],module:"Raster & Vector Data Models",title:"Data models and topology",
 concept:["Vector data stores discrete features as points, lines and polygons built from vertices. Raster data stores a grid of cells with one value each, suited to continuous surfaces. A TIN joins irregularly spaced points into triangles.","Topology records how features relate: adjacency (polygons sharing an edge), connectivity (lines meeting at nodes) and containment. Topology rules such as 'must not overlap' and 'must not have gaps' let software find digitising errors automatically.","Spatial predicates (intersects, touches, within, contains, crosses, overlaps, disjoint) are formalised in the DE-9IM model."],
 formula:[["V − E + F = 2","Euler's formula for a connected planar graph (F counts the outer face)"]],
 vocab:[["Topology","Rules about how features share geometry."],["Adjacency","Polygons that share a boundary."],["Sliver polygon","Thin unwanted polygon from mismatched edges."],["Dangle","A line end that fails to connect."],["TIN","Triangulated Irregular Network of irregular points."]],
 predict:{q:"Two parcel polygons accidentally share part of their area. Which topology rule catches this?",o:["Must not have dangles","Must not overlap","Must be single part","Must not self-intersect"],a:"B",ex:"Parcels should tile the land without overlapping, so 'must not overlap' flags the shared area."},
 check:[{q:"Which data model joins irregularly spaced sample points into triangles?",o:["Raster","TIN","Quadtree","Grid"],a:"B",ex:"A TIN (Triangulated Irregular Network) uses irregular points, dense where terrain is complex."}],
 demo:"topology",steps:[["A valid layer","Parcels share edges with no gaps and no overlaps."],["Overlap error","Two polygons claim the same ground (red)."],["Gap error","A sliver of unassigned land between neighbours."],["Dangle","A road line stops short of the junction."],["Validated","Errors fixed: the layer passes its topology rules."]]},

{id:"quality",area:2,ksa:["203","205","206","208"],module:"Geospatial Standards & Data Quality",title:"Accuracy, precision and metadata",
 concept:["Accuracy is closeness to the true value; precision is how tightly repeated measurements agree. Data can be precise and still wrong.","ISO and FGDC describe data quality through positional accuracy, attribute accuracy, logical consistency, completeness, temporal accuracy and lineage. Quality assurance (QA) prevents errors through standards and procedures; quality control (QC) finds errors in the finished product.","Positional accuracy is summarised with RMSE and reported at 95% confidence under NSSDA. Metadata (ISO 19115, FGDC CSDGM) records all of this so others can judge fitness for use."],
 formula:[["RMSE = √( Σ e² ÷ n )","Root mean square error of check-point errors"],["NSSDA 95%: 1.7308·RMSEr (horiz.) · 1.9600·RMSEz (vert.)","Accuracy reporting"]],
 vocab:[["Accuracy","Closeness to the true value."],["Precision","Repeatability or level of detail."],["Lineage","Sources and processing history of data."],["Logical consistency","Data obeys its rules and valid values."],["ISO 19115","International metadata standard."]],
 predict:{q:"GPS fixes cluster within 30 cm of each other but sit 8 m from the surveyed truth. They are…",o:["Accurate and precise","Precise but not accurate","Accurate but not precise","Neither"],a:"B",ex:"Tight clustering is precision; the 8 m offset from truth means poor accuracy."},
 check:[{q:"Which activity is quality ASSURANCE rather than quality control?",o:["Running topology checks on delivered data","Writing the digitising standard before collection","Measuring RMSE on check points","Comparing features with imagery"],a:"B",ex:"QA prevents errors through process; the other options inspect a finished product (QC)."},{q:"Check-point errors are 3, 4, 0 and 5 m. What is the RMSE?",o:["3.00 m","3.54 m","12.5 m","4.00 m"],a:"B",ex:"(9 + 16 + 0 + 25) ÷ 4 = 12.5; √12.5 ≈ 3.54 m."}],
 demo:"quality",steps:[["Ground truth","The surveyed position sits at the centre of the target."],["Precise, not accurate","Tight cluster, but offset from the truth."],["Accurate and precise","Tight and centred."],["RMSE and 95% circle","RMSE summarises the error; NSSDA reports the 95% radius."]]},

{id:"carto",area:3,ksa:["301","302","303","304"],module:"Cartography & Geographic Visualization",title:"Surfaces, contours and shaded relief",
 concept:["Elevation is a continuous surface. Cartographers show it with contour lines (lines of equal elevation), hypsometric tints, hillshading and 3D views.","Contour lines close together mean steep slopes. The contour interval is the height step between lines; every fifth line is usually a darker, labelled index contour.","Hillshade simulates light from an imaginary sun, by default from the north-west (azimuth 315°) at 45° altitude. 3D views add realism but hide areas behind hills and distort scale with perspective."],
 formula:[["slope % = rise ÷ run × 100","Steepness between two points"],["hillshade default: azimuth 315°, altitude 45°","Light from the north-west"]],
 vocab:[["Contour interval","Height difference between neighbouring contours."],["Index contour","Bold, labelled contour, usually every fifth line."],["Hillshade","Shaded relief from a simulated light source."],["Visual hierarchy","Ordering map elements by importance."]],
 predict:{q:"On a topographic map, contour lines are bunched tightly together. The terrain there is…",o:["Flat","Steep","A lake","A data error"],a:"B",ex:"Many contours in a short horizontal distance means elevation changes quickly: a steep slope."},
 check:[{q:"You must map TOTAL population by county. Which map type suits raw counts?",o:["Choropleth","Proportional symbols","Isarithmic","Hillshade"],a:"B",ex:"Raw totals belong on proportional symbols; choropleths need normalised values such as density."}],
 demo:"terrain",steps:[["The surface","A digital elevation model: one height for every location."],["Contours","Lines of equal elevation traced on the surface; amber lines are index contours."],["Contour map","Dropped onto a flat sheet, the lines become a topographic map."],["Hillshade","Light from azimuth 315°, altitude 45° reveals the relief."]]},

{id:"gnss",area:4,ksa:["402"],module:"GPS & GNSS Technologies",title:"How GNSS finds you",
 concept:["GNSS receivers (GPS, GLONASS, Galileo, BeiDou) measure the travel time of signals from several satellites and turn each into a distance. Intersecting those distances is trilateration.","Four unknowns must be solved: x, y, z and the receiver clock error, so a 3D fix needs at least four satellites.","Accuracy depends on satellite geometry (DOP), atmospheric delay, multipath reflections and orbit and clock errors. Differential corrections (DGPS, SBAS) and RTK reduce error from metres to centimetres."],
 formula:[["unknowns: x, y, z, Δt ⇒ ≥ 4 satellites","Minimum for a 3D position"],["PDOP = √(q_xx + q_yy + q_zz)","Position dilution of precision from satellite geometry"]],
 vocab:[["Trilateration","Positioning from measured distances."],["PDOP","Geometry factor: lower is better."],["Multipath","Signals reflected before reaching the antenna."],["RTK","Real-time kinematic corrections; centimetre accuracy."]],
 predict:{q:"What is the minimum number of satellites for a 3D position fix?",o:["3","4","5","6"],a:"B",ex:"Four measurements solve four unknowns: x, y, z and the receiver clock error."},
 check:[{q:"All visible satellites are bunched near the zenith. What happens?",o:["Low PDOP, strong fix","High PDOP, weaker fix","No change","Multipath disappears"],a:"B",ex:"Clustered satellites give poor geometry, so PDOP rises and the position is less reliable."}],
 demo:"gnss",steps:[["One satellite","You are somewhere on a sphere around it."],["Two satellites","Two spheres meet in a circle."],["Three satellites","Three spheres leave two candidate points."],["Four satellites","The fourth fixes the clock error: one position."]]},

{id:"rs",area:4,ksa:["404","403"],module:"Remote Sensing & Image Interpretation",title:"Spectral bands and NDVI",
 concept:["Passive sensors record reflected sunlight or emitted heat in spectral bands; active sensors (lidar, radar) send their own energy. Each band is a raster layer.","Healthy vegetation absorbs red light for photosynthesis and strongly reflects near-infrared (NIR). Comparing the two bands separates vegetation from soil, water and buildings.","Resolution has four sides: spatial (cell size), spectral (number and width of bands), radiometric (bit depth) and temporal (revisit time)."],
 formula:[["NDVI = (NIR − Red) ÷ (NIR + Red)","Ranges −1 to +1; dense healthy vegetation > 0.6"]],
 vocab:[["Spectral band","A wavelength range recorded as one raster layer."],["Multispectral","A handful of broad bands (e.g. Landsat, Sentinel-2)."],["Active sensor","Emits its own energy: lidar, radar."],["Orthorectification","Removes tilt and relief displacement from imagery."]],
 predict:{q:"Healthy green vegetation is brightest in which band?",o:["Blue","Red","Near-infrared","Thermal"],a:"C",ex:"Leaf structure reflects NIR strongly while chlorophyll absorbs red."},
 check:[{q:"A pixel has NIR = 0.50 and Red = 0.08. What is its NDVI?",o:["0.42","0.72","0.58","1.38"],a:"B",ex:"(0.50 − 0.08) ÷ (0.50 + 0.08) = 0.42 ÷ 0.58 ≈ 0.72."}],
 demo:"bands",steps:[["True-colour image","Blue, green and red bands combined as we see them."],["Separate bands","Each band is its own raster layer."],["NIR reveals vegetation","Fields glow in near-infrared while water stays dark."],["NDVI","(NIR − Red) ÷ (NIR + Red): green high, brown low."]]},

{id:"raster",area:6,ksa:["204","501","604"],module:"Raster & Vector Data Analysis",title:"Raster resolution and map algebra",
 concept:["A raster's cell size is its spatial resolution. Halving the cell size quadruples the number of cells, so detail and storage rise together.","Resampling changes cell size or alignment. Nearest neighbour keeps original values and suits categories such as land cover; bilinear and cubic convolution average values and suit continuous data such as elevation.","Map algebra combines rasters cell by cell: local operations use the same cell, focal operations use a moving neighbourhood, zonal operations summarise per zone and global operations use the whole raster."],
 formula:[["cells = (extent ÷ cell size)²","For a square extent"],["local: out[i,j] = f(A[i,j], B[i,j])","Map algebra"]],
 vocab:[["Cell size","Ground width of one raster cell."],["Nearest neighbour","Resampling that keeps original values."],["Focal operation","Uses a moving window of neighbours."],["Zonal operation","Summarises values inside zones."]],
 predict:{q:"You halve a raster's cell size over the same extent. The number of cells…",o:["Doubles","Quadruples","Halves","Stays the same"],a:"B",ex:"Both rows and columns double, so 2 × 2 = 4 times as many cells."},
 check:[{q:"Which resampling method should you use for a land-cover raster?",o:["Bilinear","Cubic convolution","Nearest neighbour","Spline"],a:"C",ex:"Nearest neighbour never invents in-between class codes."}],
 demo:"raster",steps:[["Coarse cells","8 × 8 cells: blocky but small."],["Finer cells","16 × 16: four times the cells, more detail."],["Fine cells","32 × 32: the surface emerges."],["Focal window","A 3 × 3 window slides across, averaging neighbours."]]},

{id:"overlay",area:6,ksa:["603","601"],module:"Spatial Analysis & Geoprocessing",title:"Buffers, overlays and spatial joins",
 concept:["A buffer is the zone within a set distance of a feature. Overlay operations combine layers: intersect keeps only shared area, union keeps everything, clip cuts one layer by another and erase removes it.","Overlay results are only as accurate as their inputs, need a common coordinate system and often produce thin sliver polygons where boundaries were digitised separately.","A spatial join transfers attributes between layers based on location, for example counting wells inside each flood zone."],
 formula:[["Intersect = A ∩ B · Union = A ∪ B","Set logic of overlay"],["Buffer(d) = { p : distance(p, feature) ≤ d }","Definition of a buffer"]],
 vocab:[["Buffer","Area within a distance of a feature."],["Intersect","Keeps only the overlapping area of inputs."],["Clip","Cuts input features to a boundary."],["Spatial join","Joins attributes by location."]],
 predict:{q:"You need only the land that is BOTH inside the river's 100 m buffer AND zoned residential. Which operation?",o:["Union","Intersect","Erase","Dissolve"],a:"B",ex:"Intersect returns only the area common to both inputs."},
 check:[{q:"Overlaying two layers digitised separately often creates…",o:["Dangles","Sliver polygons","Pseudo nodes only","Raster cells"],a:"B",ex:"Slightly mismatched boundaries leave thin slivers in the overlay output."}],
 demo:"overlay",steps:[["A river","A line feature on the map sheet."],["Buffer","Everything within 100 m of the river."],["Zoning polygon","A residential zone crosses the buffer."],["Intersect","Only the shared area remains."],["Spatial join","Wells inside the result inherit its attributes."]]},

{id:"stats",area:6,ksa:["605","602"],module:"Spatial Statistics & Modeling",title:"Patterns, density and hot spots",
 concept:["Tobler's first law says near things are more related than distant things; spatial statistics measure how true that is for a dataset.","The nearest-neighbour index compares the observed mean distance between points with the distance expected at random. Moran's I measures spatial autocorrelation of values: positive means similar values cluster.","Kernel density turns points into a smooth surface; Getis-Ord Gi* finds statistically significant hot and cold spots; interpolation (IDW, kriging) estimates values between samples."],
 formula:[["R = d̄_obs ÷ (0.5·√(A/n))","Nearest-neighbour index: R < 1 clustered, ≈ 1 random, > 1 dispersed"],["Moran's I: +1 clustered · 0 random · −1 dispersed","Spatial autocorrelation"]],
 vocab:[["Spatial autocorrelation","Similarity of nearby values."],["Kernel density","Smooth surface of point concentration."],["Hot spot (Gi*)","Significant cluster of high values."],["Kriging","Interpolation using a semivariogram."]],
 predict:{q:"A Moran's I of +0.8 indicates…",o:["Random pattern","Dispersed pattern","Clustered pattern","No data"],a:"C",ex:"Strong positive autocorrelation: similar values sit near each other."},
 check:[{q:"Which interpolation method uses a semivariogram and gives an error surface?",o:["IDW","Spline","Kriging","Natural neighbour"],a:"C",ex:"Kriging is geostatistical and models spatial correlation with a semivariogram."}],
 demo:"stats",steps:[["Incidents","Point events scattered over a city."],["Kernel density","Points become a smooth density surface."],["Hot spots","Gi* columns mark significant clusters."]]},

{id:"gdb",area:7,ksa:["701","702","703","704"],module:"Geospatial Databases & Geodatabase Design",title:"Geodatabase design",
 concept:["A table holds records (rows) and fields (columns). A primary key identifies each record; a foreign key points to a key in another table.","Cardinality describes how records relate: one-to-one, one-to-many, many-to-many. A many-to-many relationship needs a junction (associative) table, and in GIS you relate rather than join such tables.","Domains, defaults and subtypes protect data integrity; versioning supports many editors; replication serves remote offices; roles and least privilege protect the data."],
 formula:[["1NF → 2NF → 3NF","Atomic values → no partial dependency → no transitive dependency"],["M:N ⇒ junction table (FK₁, FK₂)","Resolving many-to-many"]],
 vocab:[["Primary key","Field that uniquely identifies a record."],["Foreign key","Field referring to another table's key."],["Cardinality","1:1, 1:M or M:N relationship."],["Domain","Allowed values for a field."],["Versioning","Multi-user editing with reconcile and post."]],
 predict:{q:"Students take many classes and classes have many students. How do you model it?",o:["A single join","A junction (associative) table","A merge","A domain"],a:"B",ex:"Many-to-many relationships are resolved with a junction table holding both foreign keys."},
 check:[{q:"What stops editors misspelling zoning codes?",o:["Spell check","A coded-value domain","A default value","A spatial index"],a:"B",ex:"A domain restricts the field to a list of valid codes."}],
 demo:"gdb",steps:[["Tables","Parcels, Owners and Permits as separate tables."],["One-to-many","One parcel has many permits: the foreign key flows."],["Many-to-many","Owners and parcels link through a junction table."]]},

{id:"arch",area:9,ksa:["801","901","902","903"],module:"GIS Software, Architecture & Web GIS",title:"Web GIS architecture",
 concept:["Web GIS is a multi-tier system: clients (browsers, mobile apps) send requests over HTTPS to a web server, a GIS server does the spatial work and a database stores the data.","OGC standards keep systems interoperable: WMS returns map images, WFS returns vector features (WFS-T lets clients edit), WCS returns coverages and WMTS returns cached tiles. REST APIs exchange JSON or GeoJSON.","Cloud deployment (IaaS, PaaS, SaaS) adds elastic scaling and removes hardware purchases, but security still needs HTTPS, authentication, least privilege and patching."],
 formula:[["client → HTTPS → web server → GIS server → database","Request path"],["WMS images · WFS features · WCS coverages","OGC services"]],
 vocab:[["Client–server","Clients request; servers provide."],["REST","Stateless web API using HTTP verbs."],["WFS-T","Transactional WFS for editing features."],["Least privilege","Users get only the access they need."]],
 predict:{q:"Which OGC service lets a web client EDIT vector features?",o:["WMS","WMTS","WFS-T","WCS"],a:"C",ex:"Transactional WFS supports insert, update and delete of features."},
 check:[{q:"Which protocol is both secure and widely accessible for a public web map?",o:["HTTP","HTTPS","LDAP","SFTP"],a:"B",ex:"HTTPS encrypts traffic with TLS and works in every browser."}],
 demo:"arch",steps:[["The tiers","Clients, web server, GIS server and database."],["A map request","A request travels down the tiers over HTTPS."],["The response","Map images (WMS) or features (WFS) flow back."]]},

{id:"pm",area:10,ksa:["1001","1002","1003","1004","1005"],module:"GIS Project Management & Professional Ethics",title:"Projects and professional practice",
 concept:["A GIS project moves through initiation, planning, execution and closing, while monitoring and control run through every phase. Scope, time and cost form the triple constraint.","The GISCI Code of Ethics sets obligations to society, to employers and funders, to colleagues and the profession, and to individuals in society: honesty, no misrepresentation of data, avoiding conflicts of interest, protecting privacy and working within your competence.","Determining a legal property boundary is licensed surveying, not GIS work. Good practice uses authoritative data, documents it with metadata and communicates its limits."],
 formula:[["scope · time · cost","Triple constraint"],["monitoring & control ⊃ every phase","Project lifecycle"]],
 vocab:[["WBS","Work breakdown structure: the project split into tasks."],["Critical path","Longest chain of dependent tasks."],["Conflict of interest","A personal interest that could bias work."],["Authoritative data","Official data from the responsible agency."]],
 predict:{q:"At what stage of a GIS project do you perform monitoring?",o:["Only at delivery","During all stages","Only during data collection","Only when buying software"],a:"B",ex:"Monitoring and control span the whole lifecycle."},
 check:[{q:"Which task is NOT appropriate for a GIS professional?",o:["Mapping school district boundaries","Collecting field data to recover a legal property boundary","Georeferencing source maps","Producing parcel maps"],a:"B",ex:"Recovering legal boundaries is licensed surveying work."}],
 demo:"pm",steps:[["The phases","Initiation, planning, execution and closing rise in turn."],["Monitoring & control","A ring that spans every phase."],["Triple constraint","Scope, time and cost hold each other in balance."]]},
];

const AR_L={

 concept:["نظام الإحداثيات المرجعي (CRS) هو الاتفاق الذي يحوّل الأرقام إلى أماكن. النظام الجغرافي يسجّل الموقع بزاويتين: خط العرض (Latitude) وخط الطول (Longitude)، مقاستين على الإهليلج الخاص بالمرجع (Datum).","النظام المُسقَط (Projected CRS) يفرد هذا السطح المنحني على مستوى، فيصبح الموقع x وy بوحدات خطية كالمتر أو القدم. نظام UTM يقسم العالم إلى 60 منطقة، عرض كل منها 6° طولية، ولكل منها خط زوال مركزي وإزاحة شرقية زائفة قدرها 500,000 م.","لكل نظام معرّف رقمي، غالباً رمز EPSG، حتى تعرف البرامج بدقة المرجع والإسقاط والوحدات المستخدمة."],
 fnotes:["تحويل الدرجات والدقائق والثواني إلى درجات عشرية","رقم منطقة UTM من خط الطول λ (دبي 55.3° شرقاً ← المنطقة 40)"],
 vocab:[["Latitude — خط العرض","الزاوية شمال أو جنوب خط الاستواء، من −90° إلى +90°."],["Longitude — خط الطول","الزاوية شرق أو غرب خط غرينتش، من −180° إلى +180°."],["Graticule — الشبكة الجغرافية","شبكة خطوط العرض والطول."],["UTM","60 منطقة بإسقاط مركاتور المستعرض، عرض كل منها 6°، وإحداثياتها بالمتر."],["EPSG code — رمز EPSG","معرّف رقمي لنظام الإحداثيات، مثل 4326 لنظام WGS 84."]],
