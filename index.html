 steps:[["الشبكة الجغرافية","خطوط العرض وخطوط الطول تلتف حول الكرة."],["نقطتا البداية","خط الاستواء (عرض 0°) وخط غرينتش (طول 0°) هما مرجعا قياس الزوايا."],["موقع على الكرة","دبي عند نحو 25.2° شمالاً و55.3° شرقاً: زاويتان مقاستان من مركز الأرض."],["مناطق UTM","ستون شريطاً عرض كل منها 6°. دبي في المنطقة 40، حيث تصبح الإحداثيات أمتاراً شرقاً وشمالاً."]]},
proj:{title:"إسقاطات الخرائط",module:"أنظمة الإحداثيات وإسقاطات الخرائط",
 concept:["الإسقاط (Projection) ينقل الشبكة الجغرافية من الكرة إلى سطح قابل للفرد: أسطوانة أو مخروط أو مستوى. ولأن الكرة لا تُفرد دون شدّ، فكل إسقاط يشوّه شيئاً ما.","الإسقاطات المطابِقة (Conformal) مثل مركاتور ومركاتور المستعرض ولامبرت المخروطي تحفظ الزوايا والأشكال محلياً. والإسقاطات متساوية المساحة (Equal-area) مثل ألبرز تحفظ المساحة. ومتساوية المسافة تحفظ المسافة من نقاط محددة، والسَّمتية (Azimuthal) تحفظ الاتجاه من مركزها.","مؤشر تيسو (Tissot's indicatrix) يُظهر التشوّه: دوائر صغيرة متطابقة على الكرة تتحول على الخريطة إلى قطوع ناقصة أكبر أو أكثر تفلطحاً."],
 fnotes:["الإحداثي الشمالي في مركاتور لخط العرض φ","معامل مقياس مركاتور: ضعفان عند 60° ونحو 5.8 ضعف عند 80°"],
 vocab:[["Conformal — مطابِق","يحفظ الزوايا والشكل المحلي."],["Equal-area — متساوي المساحة","يحفظ النسب بين المساحات."],["Developable surface — سطح قابل للفرد","أسطوانة أو مخروط أو مستوى يمكن فرده بلا تمزق."],["Tissot's indicatrix — مؤشر تيسو","دوائر تكشف تشوّه الإسقاط."]],
 predict:{q:"تحتاج إلى مقارنة مساحة الغابات عبر قارة كاملة. أي إسقاط هو الأنسب؟",o:["مركاتور","ألبرز المخروطي متساوي المساحة","مركاتور الويب","مركاتور المستعرض"],ex:"مقارنة المساحات تحتاج إسقاطاً متساوي المساحة. مركاتور ومركاتور الويب يضخّمان المساحات قرب القطبين."},
 check:[{q:"لماذا تبدو غرينلاند بحجم أفريقيا في خريطة مركاتور؟",o:["لأن مركاتور متساوي المساحة","لأن المقياس يكبر نحو القطبين (k = sec φ)","لأن غرينلاند تستخدم مرجعاً آخر","لأن مركاتور سَمتي"],ex:"مركاتور مطابِق؛ وليحفظ الأشكال يمدّ المقياس بمقدار sec φ، فتبدو المناطق القطبية أكبر بكثير من حقيقتها."}],

datum:{title:"نماذج الأرض والمراجع والارتفاعات",module:"أساسيات نظم المعلومات الجغرافية والجيوديسيا",
 concept:["تنمذج الجيوديسيا الأرض بثلاث طرق. الكرة أبسطها. والإهليلج (Ellipsoid) مفلطح عند القطبين، وهو السطح الرياضي الذي تستخدمه مراجع مثل WGS 84 وNAD83. والجيويد (Geoid) يتبع الجاذبية ويقارب متوسط سطح البحر، لذا يرتفع وينخفض بالنسبة إلى الإهليلج.","المرجع الأفقي (Horizontal datum) يحدد حجم الإهليلج وشكله وموضعه. ونقل البيانات بين مرجعين (مثل NAD27 إلى NAD83) يغيّر قيم الإحداثيات ويحتاج إلى تحويل مرجعي.","أجهزة GNSS تقيس الارتفاع الإهليلجي h. أما الخرائط والهندسة فتستخدم الارتفاع الأورثومتري H المقاس من الجيويد، ويربط بينهما ارتفاع الجيويد N."],
 fnotes:["الارتفاع الأورثومتري من الارتفاع الإهليلجي وارتفاع الجيويد"],
 vocab:[["Ellipsoid — الإهليلج","نموذج رياضي أملس للأرض (GRS80، WGS 84)."],["Geoid — الجيويد","سطح جهد جاذبية متساوٍ قريب من متوسط سطح البحر."],["Datum — المرجع","مرجع يحدد موضع الإهليلج بالنسبة إلى الأرض."],["Orthometric height — الارتفاع الأورثومتري","الارتفاع فوق الجيويد (فوق سطح البحر)."]],
 predict:{q:"جهاز GPS يعطي ارتفاعاً إهليلجياً h = 50 م في موقع ارتفاع الجيويد فيه N = −30 م. ما الارتفاع الأورثومتري H؟",o:["20 م","50 م","80 م","−80 م"],ex:"H = h − N = 50 − (−30) = 80 م."},
 check:[{q:"تحوّل بيانات نقطية من NAD27 إلى NAD83. ماذا تتوقع؟",o:["إحداثيات مطابقة تماماً","تتغير الإحداثيات ويلزم تحويل مرجعي","تتغير الارتفاعات فقط","يتغير إسقاط الخريطة فقط"],ex:"المرجعان يستخدمان إهليلجين ومركزين مختلفين، فالنقطة نفسها لها إحداثيات مختلفة."}],
 steps:[["الكرة","نصف قطر واحد في كل مكان."],["الإهليلج","مفلطح عند القطبين (مع مبالغة هنا للتوضيح)."],["الجيويد","الجاذبية تجعله متموجاً: الذهبي فوق الإهليلج والأزرق تحته."],["ثلاثة ارتفاعات","h فوق الإهليلج، وN للجيويد، وH = h − N فوق سطح البحر."]]},
topo:{title:"نماذج البيانات والطوبولوجيا",module:"نماذج البيانات الخطية والشبكية",
 concept:["البيانات الخطية (Vector) تخزّن المعالم المنفصلة نقاطاً وخطوطاً ومضلعات مبنية من رؤوس. والبيانات الشبكية (Raster) تخزّن شبكة خلايا لكل منها قيمة واحدة، وتناسب الأسطح المتصلة. أما TIN فيربط نقاطاً غير منتظمة التباعد في مثلثات.","الطوبولوجيا (Topology) تسجّل علاقات المعالم: التجاور (مضلعات تشترك في حد)، والاتصال (خطوط تلتقي عند عُقد)، والاحتواء. وقواعد مثل «يجب ألا تتداخل» و«يجب ألا توجد فجوات» تتيح للبرنامج كشف أخطاء الترقيم تلقائياً.","العلاقات المكانية (يتقاطع، يلامس، داخل، يحتوي، يعبر، يتداخل، منفصل) مصاغة رسمياً في نموذج DE-9IM."],
 fnotes:["صيغة أويلر لرسم مستوٍ متصل (F تشمل الوجه الخارجي)"],
 vocab:[["Topology — الطوبولوجيا","قواعد اشتراك المعالم في الهندسة."],["Adjacency — التجاور","مضلعات تشترك في حد."],["Sliver polygon — مضلع شريطي","مضلع رفيع غير مرغوب ناتج عن حدود غير متطابقة."],["Dangle — طرف معلّق","نهاية خط لا تتصل بخط آخر."],["TIN","شبكة مثلثات غير منتظمة من نقاط غير منتظمة."]],
 predict:{q:"مضلعا قطعتي أرض يشتركان خطأً في جزء من المساحة. أي قاعدة طوبولوجية تكشف ذلك؟",o:["يجب ألا توجد أطراف معلّقة","يجب ألا تتداخل","يجب أن تكون جزءاً واحداً","يجب ألا تتقاطع ذاتياً"],ex:"قطع الأراضي تغطي الأرض دون تداخل، فقاعدة «يجب ألا تتداخل» تكشف المساحة المشتركة."},
 check:[{q:"أي نموذج بيانات يربط نقاط عيّنة غير منتظمة التباعد في مثلثات؟",o:["الشبكي (Raster)","TIN","الشجرة الرباعية (Quadtree)","الشبكة المنتظمة (Grid)"],ex:"TIN يستخدم نقاطاً غير منتظمة، كثيفة حيث التضاريس معقدة."}],
 steps:[["طبقة سليمة","قطع الأراضي تشترك في حدودها بلا فجوات ولا تداخل."],["خطأ تداخل","مضلعان يطالبان بالأرض نفسها (بالأحمر)."],["خطأ فجوة","شريط أرض غير منسوب لأحد بين جارين."],["طرف معلّق","خط الطريق يتوقف قبل التقاطع."],["تم التحقق","صُحّحت الأخطاء: الطبقة تجتاز قواعدها الطوبولوجية."]]},
quality:{title:"الدقة والضبط والبيانات الوصفية",module:"معايير البيانات المكانية وجودتها",
 concept:["الدقة (Accuracy) قرب القياس من القيمة الحقيقية، والضبط (Precision) مدى تقارب القياسات المتكررة. قد تكون البيانات مضبوطة وخاطئة في آن.","تصف ISO وFGDC جودة البيانات بالدقة الموضعية، ودقة الصفات، والاتساق المنطقي، والاكتمال، والدقة الزمنية، والنَّسَب (Lineage). ضمان الجودة (QA) يمنع الأخطاء عبر المعايير والإجراءات، وضبط الجودة (QC) يكتشفها في المنتج النهائي.","تُلخَّص الدقة الموضعية بـ RMSE وتُعلَن بثقة 95% وفق NSSDA. والبيانات الوصفية (ISO 19115، FGDC CSDGM) توثّق كل ذلك ليحكم الآخرون على ملاءمتها للاستخدام."],
 fnotes:["جذر متوسط مربعات أخطاء نقاط التحقق","الإعلان عن الدقة"],
 vocab:[["Accuracy — الدقة","القرب من القيمة الحقيقية."],["Precision — الضبط","قابلية التكرار أو مستوى التفصيل."],["Lineage — النَّسَب","مصادر البيانات وتاريخ معالجتها."],["Logical consistency — الاتساق المنطقي","التزام البيانات بقواعدها وقيمها المسموحة."],["ISO 19115","المعيار الدولي للبيانات الوصفية."]],
 predict:{q:"قراءات GPS تتجمع ضمن 30 سم من بعضها، لكنها تبعد 8 م عن الموقع الحقيقي المساحي. هذه القراءات…",o:["دقيقة ومضبوطة","مضبوطة لكنها غير دقيقة","دقيقة لكنها غير مضبوطة","لا هذا ولا ذاك"],ex:"التجمّع المحكم هو الضبط، والابتعاد 8 م عن الحقيقة يعني دقة ضعيفة."},
 check:[{q:"أي نشاط يُعدّ ضمان جودة (QA) لا ضبط جودة (QC)؟",o:["تشغيل فحوص الطوبولوجيا على البيانات المسلَّمة","كتابة معيار الترقيم قبل الجمع","قياس RMSE على نقاط التحقق","مقارنة المعالم بالصور"],ex:"ضمان الجودة يمنع الأخطاء عبر الإجراءات؛ والخيارات الأخرى تفحص منتجاً منتهياً (QC)."},{q:"أخطاء نقاط التحقق 3 و4 و0 و5 م. ما قيمة RMSE؟",o:["3.00 م","3.54 م","12.5 م","4.00 م"],ex:"(9 + 16 + 0 + 25) ÷ 4 = 12.5؛ √12.5 ≈ 3.54 م."}],
 steps:[["الحقيقة الأرضية","الموقع المساحي الحقيقي في مركز الهدف."],["مضبوط غير دقيق","تجمّع محكم لكنه مزاح عن الحقيقة."],["دقيق ومضبوط","محكم ومتمركز."],["RMSE ودائرة 95%","RMSE يلخّص الخطأ، وNSSDA يعلن نصف قطر 95%."]]},
carto:{title:"الأسطح وخطوط الكنتور والتظليل",module:"الكارتوغرافيا والتصوير الجغرافي",
 concept:["الارتفاع سطح متصل. ويعرضه رسّامو الخرائط بخطوط الكنتور (خطوط تساوي الارتفاع)، والتلوين حسب الارتفاع، والتظليل التضاريسي، والمناظر ثلاثية الأبعاد.","تقارب خطوط الكنتور يعني انحداراً شديداً. والفاصل الكنتوري (Contour interval) هو فرق الارتفاع بين خطين متجاورين، وغالباً يكون كل خامس خط أغمق ومرقّماً.","التظليل (Hillshade) يحاكي ضوء شمس افتراضية، افتراضياً من الشمال الغربي (سمت 315°) بارتفاع 45°. المناظر ثلاثية الأبعاد تضيف واقعية لكنها تخفي ما خلف التلال وتشوّه المقياس بالمنظور."],
 fnotes:["شدة الانحدار بين نقطتين","الضوء من الشمال الغربي"],
 vocab:[["Contour interval — الفاصل الكنتوري","فرق الارتفاع بين خطي كنتور متجاورين."],["Index contour — الكنتور الرئيسي","خط عريض مرقّم، عادة كل خامس خط."],["Hillshade — التظليل التضاريسي","تضاريس مظللة من مصدر ضوء محاكى."],["Visual hierarchy — التسلسل البصري","ترتيب عناصر الخريطة حسب أهميتها."]],
 predict:{q:"على خريطة طبوغرافية تتزاحم خطوط الكنتور بشدة. التضاريس هناك…",o:["مستوية","شديدة الانحدار","بحيرة","خطأ في البيانات"],ex:"خطوط كثيرة في مسافة أفقية قصيرة تعني تغيّر الارتفاع بسرعة: انحدار شديد."},
 check:[{q:"عليك تمثيل إجمالي السكان لكل مقاطعة. أي نوع خريطة يناسب الأعداد الخام؟",o:["خريطة كوروبليث (Choropleth)","الرموز المتناسبة","خريطة خطوط التساوي","التظليل التضاريسي"],ex:"الأعداد الخام تُمثَّل بالرموز المتناسبة؛ أما الكوروبليث فتحتاج قيماً مُطبَّعة كالكثافة."}],
 steps:[["السطح","نموذج ارتفاع رقمي: ارتفاع واحد لكل موقع."],["خطوط الكنتور","خطوط تساوي الارتفاع مرسومة على السطح؛ الذهبية كنتورات رئيسية."],["خريطة كنتورية","حين تُسقَط الخطوط على ورقة مستوية تصبح خريطة طبوغرافية."],["التظليل","ضوء من سمت 315° وارتفاع 45° يكشف التضاريس."]]},
gnss:{title:"كيف يحدد GNSS موقعك",module:"تقنيات GPS وGNSS",
 concept:["أجهزة استقبال GNSS (GPS وGLONASS وGalileo وBeiDou) تقيس زمن وصول الإشارات من عدة أقمار وتحوّل كلاً منها إلى مسافة. تقاطع هذه المسافات هو التثليث بالمسافات (Trilateration).","هناك أربعة مجاهيل: x وy وz وخطأ ساعة المستقبِل، لذا يحتاج التحديد ثلاثي الأبعاد إلى أربعة أقمار على الأقل.","تعتمد الدقة على هندسة الأقمار (DOP)، وتأخير الغلاف الجوي، وانعكاس الإشارات (Multipath)، وأخطاء المدارات والساعات. التصحيحات التفاضلية (DGPS وSBAS) وRTK تخفض الخطأ من أمتار إلى سنتيمترات."],
 fnotes:["الحد الأدنى لموقع ثلاثي الأبعاد","معامل تخفيف الدقة الموضعية من هندسة الأقمار"],
 vocab:[["Trilateration — التثليث بالمسافات","تحديد الموقع من مسافات مقاسة."],["PDOP","معامل هندسي: كلما قلّ كان أفضل."],["Multipath — تعدد المسارات","إشارات منعكسة قبل وصولها إلى الهوائي."],["RTK","تصحيحات حركية آنية بدقة سنتيمترية."]],
 predict:{q:"ما أقل عدد من الأقمار لتحديد موقع ثلاثي الأبعاد؟",o:["3","4","5","6"],ex:"أربعة قياسات تحل أربعة مجاهيل: x وy وz وخطأ ساعة المستقبِل."},
 check:[{q:"كل الأقمار المرئية متجمعة قرب السمت فوق الرأس. ماذا يحدث؟",o:["PDOP منخفض وموقع قوي","PDOP مرتفع وموقع أضعف","لا تغيير","يختفي تعدد المسارات"],ex:"تجمّع الأقمار يعني هندسة سيئة، فيرتفع PDOP ويقل الوثوق بالموقع."}],
 steps:[["قمر واحد","أنت في مكان ما على كرة حوله."],["قمران","الكرتان تلتقيان في دائرة."],["ثلاثة أقمار","ثلاث كرات تترك نقطتين مرشحتين."],["أربعة أقمار","الرابع يحل خطأ الساعة: موقع واحد."]]},
rs:{title:"النطاقات الطيفية وNDVI",module:"الاستشعار عن بعد وتفسير الصور",
 concept:["المستشعرات السلبية (Passive) تسجّل ضوء الشمس المنعكس أو الحرارة المنبعثة في نطاقات طيفية؛ والنشطة (Active) مثل الليدار والرادار ترسل طاقتها الخاصة. كل نطاق طبقة شبكية مستقلة.","النبات السليم يمتص الضوء الأحمر في التمثيل الضوئي ويعكس الأشعة تحت الحمراء القريبة (NIR) بقوة. المقارنة بين النطاقين تفصل النبات عن التربة والماء والمباني.","للدقة أربعة أوجه: مكانية (حجم الخلية)، وطيفية (عدد النطاقات وعرضها)، وإشعاعية (عمق البت)، وزمنية (مدة إعادة الزيارة)."],
 fnotes:["تتراوح من −1 إلى +1؛ والنبات الكثيف السليم أعلى من 0.6"],
 vocab:[["Spectral band — نطاق طيفي","مدى أطوال موجية يُسجَّل طبقةً شبكية واحدة."],["Multispectral — متعدد الأطياف","عدد قليل من النطاقات العريضة (Landsat، Sentinel-2)."],["Active sensor — مستشعر نشط","يرسل طاقته: الليدار والرادار."],["Orthorectification — التقويم العمودي","إزالة الميل وإزاحة التضاريس من الصور."]],
 predict:{q:"في أي نطاق يبدو النبات الأخضر السليم أكثر سطوعاً؟",o:["الأزرق","الأحمر","تحت الأحمر القريب","الحراري"],ex:"بنية الورقة تعكس NIR بقوة بينما يمتص الكلوروفيل الأحمر."},
 check:[{q:"بكسل فيه NIR = 0.50 وRed = 0.08. ما قيمة NDVI؟",o:["0.42","0.72","0.58","1.38"],ex:"(0.50 − 0.08) ÷ (0.50 + 0.08) = 0.42 ÷ 0.58 ≈ 0.72."}],
 steps:[["صورة بالألوان الحقيقية","النطاقات الأزرق والأخضر والأحمر مدمجة كما نراها."],["نطاقات منفصلة","كل نطاق طبقة شبكية مستقلة."],["NIR يكشف النبات","الحقول تتوهج في تحت الأحمر القريب والماء يبقى داكناً."],["NDVI","(NIR − Red) ÷ (NIR + Red): الأخضر مرتفع والبني منخفض."]]},
raster:{title:"دقة البيانات الشبكية وجبر الخرائط",module:"تحليل البيانات الشبكية والخطية",
 concept:["حجم الخلية في البيانات الشبكية هو دقتها المكانية. تنصيف حجم الخلية يضاعف عدد الخلايا أربع مرات، فيرتفع التفصيل والتخزين معاً.","إعادة المعاينة (Resampling) تغيّر حجم الخلية أو محاذاتها. الجار الأقرب يحفظ القيم الأصلية ويناسب الفئات كغطاء الأرض؛ والثنائي الخطي والتلافيف التكعيبية تحسب متوسطات وتناسب البيانات المتصلة كالارتفاع.","جبر الخرائط (Map algebra) يجمع الطبقات خلية بخلية: العمليات المحلية تستخدم الخلية نفسها، والبؤرية نافذة متحركة من الجيران، والنطاقية تلخّص لكل نطاق، والشاملة تستخدم الطبقة كلها."],
 fnotes:["لامتداد مربع","جبر الخرائط"],
 vocab:[["Cell size — حجم الخلية","العرض الأرضي لخلية واحدة."],["Nearest neighbour — الجار الأقرب","إعادة معاينة تحفظ القيم الأصلية."],["Focal operation — عملية بؤرية","تستخدم نافذة متحركة من الجيران."],["Zonal operation — عملية نطاقية","تلخّص القيم داخل النطاقات."]],
 predict:{q:"نصّفت حجم خلية طبقة شبكية على الامتداد نفسه. عدد الخلايا…",o:["يتضاعف","يصبح أربعة أضعاف","ينخفض للنصف","يبقى كما هو"],ex:"الصفوف والأعمدة تتضاعف كلاهما، فيصبح العدد 2 × 2 = 4 أضعاف."},
 check:[{q:"أي طريقة إعادة معاينة تستخدم لطبقة غطاء الأرض؟",o:["الثنائي الخطي","التلافيف التكعيبية","الجار الأقرب","الشرائح (Spline)"],ex:"الجار الأقرب لا يخترع رموز فئات وسيطة."}],

overlay:{title:"النطاقات العازلة والتراكب والربط المكاني",module:"التحليل المكاني والمعالجة الجغرافية",
 concept:["النطاق العازل (Buffer) هو المنطقة الواقعة ضمن مسافة محددة من معلَم. وعمليات التراكب تجمع الطبقات: التقاطع (Intersect) يُبقي المساحة المشتركة فقط، والاتحاد (Union) يُبقي كل شيء، والقص (Clip) يقطع طبقة بحدود أخرى، والمحو (Erase) يزيلها.","نتائج التراكب دقيقة بقدر دقة مدخلاتها فقط، وتحتاج نظام إحداثيات موحداً، وكثيراً ما تنتج مضلعات شريطية حيث رُقّمت الحدود منفصلة.","الربط المكاني (Spatial join) ينقل الصفات بين الطبقات حسب الموقع، مثل عدّ الآبار داخل كل منطقة فيضان."],
 fnotes:["منطق المجموعات في التراكب","تعريف النطاق العازل"],

stats:{title:"الأنماط والكثافة والبؤر الساخنة",module:"الإحصاء المكاني والنمذجة",
 concept:["قانون توبلر الأول: الأشياء القريبة أكثر ارتباطاً من البعيدة. والإحصاء المكاني يقيس مدى صحة ذلك في مجموعة بيانات.","مؤشر الجار الأقرب يقارن متوسط المسافة المرصودة بين النقاط بالمسافة المتوقعة عشوائياً. ومؤشر موران (Moran's I) يقيس الارتباط الذاتي المكاني للقيم: الموجب يعني تجمّع القيم المتشابهة.","كثافة النواة (Kernel density) تحوّل النقاط إلى سطح ناعم، وGetis-Ord Gi* يكشف البؤر الساخنة والباردة ذات الدلالة الإحصائية، والاستيفاء (IDW، Kriging) يقدّر القيم بين العينات."],
 fnotes:["أقل من 1 متجمّع، ≈ 1 عشوائي، أكبر من 1 متباعد","الارتباط الذاتي المكاني"],

 predict:{q:"قيمة موران I = +0.8 تشير إلى…",o:["نمط عشوائي","نمط متباعد","نمط متجمّع","لا بيانات"],ex:"ارتباط ذاتي موجب قوي: القيم المتشابهة متجاورة."},
 check:[{q:"أي طريقة استيفاء تستخدم المخطط التبايني وتعطي سطح خطأ؟",o:["IDW","الشرائح (Spline)","الكريغنغ (Kriging)","الجار الطبيعي"],ex:"الكريغنغ طريقة جيوإحصائية تنمذج الارتباط المكاني بالمخطط التبايني."}],

gdb:{title:"تصميم قواعد البيانات الجغرافية",module:"قواعد البيانات المكانية وتصميم Geodatabase",
 concept:["الجدول يضم سجلات (صفوفاً) وحقولاً (أعمدة). المفتاح الأساسي (Primary key) يميّز كل سجل، والمفتاح الأجنبي (Foreign key) يشير إلى مفتاح في جدول آخر.","العلاقة (Cardinality) تصف ارتباط السجلات: واحد لواحد، وواحد لمتعدد، ومتعدد لمتعدد. وعلاقة متعدد لمتعدد تحتاج جدول ربط وسيطاً، وفي نظم المعلومات الجغرافية تُربط هذه الجداول بعلاقة (Relate) لا بدمج (Join).","النطاقات (Domains) والقيم الافتراضية والأنواع الفرعية تحمي سلامة البيانات؛ والإصدارات (Versioning) تدعم تعدد المحررين؛ والنسخ المتماثل (Replication) يخدم المكاتب البعيدة؛ والأدوار ومبدأ أقل الصلاحيات تحمي البيانات."],

    if(G.fly){const f=G.fly,k=1-Math.pow(.015,dt);cam.position.lerp(f.p,k);ctl.target.lerp(f.t,k);f.time-=dt;if(f.time<=0)G.fly=null;}
    if(G.orbitPending&&!G.fly){G.orbitPending=false;ctl.autoRotate=!RM();ctl.autoRotateSpeed=1.4;}
    const tg=ctl.target;tg.x=Math.max(-1.6,Math.min(1.6,tg.x));tg.z=Math.max(-1.2,Math.min(1.2,tg.z));tg.y=Math.max(-.1,Math.min(.8,tg.y));

    if(G.demo&&G.demo.tick)try{G.demo.tick(dt,now/1000);}catch(e){console.error(e);}

DEMOS.bands=()=>{const T=THREE,g=new T.Group(),N=96,cls=[],R=rngF(5);

  const tex=fn=>{const c=mkCanvas(N,N),x=c.getContext("2d"),im=x.createImageData(N,N);for(let k=0;k<N*N;k++){const [r,gg,b]=fn(cls[k],k);im.data.set([r,gg,b,255],k*4);}x.putImageData(im,0,0);const t=new T.CanvasTexture(c);t.magFilter=T.NearestFilter;t.encoding=T.sRGBEncoding;return t;};

  const rgb=tex(c=>[refl[c][2]*700,refl[c][1]*700,refl[c][0]*700].map(v=>Math.min(255,v+R()*10)));
  const ndvi=tex(c=>{const n=(refl[c][3]-refl[c][2])/(refl[c][3]+refl[c][2]);const t=(n+1)/2;return[180-120*t,120+90*t,70-20*t].map(v=>Math.max(0,Math.min(255,v)));});
  const S=.6,layer=(t,y,name,col)=>{const m=new T.Mesh(new T.BoxGeometry(S,.006,S),[mat(0xEEE8DA),mat(0xEEE8DA),new T.MeshStandardMaterial({map:t,roughness:.9}),mat(0xEEE8DA),mat(0xEEE8DA),mat(0xEEE8DA)]);m.position.y=y;inked(m,INK.ink,.4);const l=inkLabel(name,{color:col,h:.04});l.position.set(S/2+.02,.01,0);l.center.set(0,.5);m.add(l);return m;};
  const L=[layer(band(0),.02,"Blue","#1F4E9C"),layer(band(1),.02,"Green","#0E6B4F"),layer(band(2),.02,"Red","#B42318"),layer(band(3),.02,"Near-infrared","#7A5E1F")],top=layer(rgb,.03,"True colour","#10233F"),nd=layer(ndvi,.03,"NDVI","#0E6B4F");

DEMOS.stats=()=>{const T=THREE,g=new T.Group(),R=rngF(17),pts=[];const cl=[[-.2,-.15,.07],[.18,.12,.06]];

function fxTick(dt){for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.t+=dt;if(f.tick(dt,f.t)===false){G.scene.remove(f.obj);f.obj.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){[].concat(o.material).forEach(m=>{if(m.map)m.map.dispose();m.dispose();});}});FX.splice(i,1);}}}
function burst(x,z,n=90,palette=[0xB08D3C,0x0E6B4F,0x0F766E,0x10233F,0xE9B93A]){
  if(RM())return;const T=THREE,geo=new T.PlaneGeometry(.012,.02),grp=new T.Group(),parts=[];

let AC=null;
/* Only the page turn makes a sound: a soft paper swish with faint fibre crackle and a gentle landing, synthesised fresh each time so no two turns sound identical. */
function sfx(kind){if(kind!=="flip"||!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
  const sr=AC.sampleRate,dur=.78,n=Math.floor(sr*dur),b=AC.createBuffer(2,n,sr);
  for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let p0=0,p1=0,p2=0,last=0;const pan=ch?1.08:.92;
    for(let i=0;i<n;i++){const t=i/sr,w=Math.random()*2-1;
      /* pinkish noise = paper air */
      p0=.99765*p0+w*.099;p1=.963*p1+w*.2965;p2=.57*p2+w*1.0526;let pink=(p0+p1+p2+w*.1848)*.11;
      /* swish envelope: lift, sweep (louder in the middle), settle */
      const sw=t<.06?t/.06:Math.exp(-Math.pow((t-.3)/.2,2))*.9+.25*Math.exp(-(t-.06)*6);
      let v=pink*sw*.55;
      /* fibre crackle: sparse tiny grains while the leaf bends */
      if(t>.05&&t<.5&&Math.random()<.0028)last=(Math.random()*.5+.2)*(Math.random()<.5?-1:1);
      v+=last;last*=.82;
      /* landing: soft low flap as the page settles */
      if(t>.56){const u=t-.56;v+=Math.sin(2*Math.PI*95*u)*Math.exp(-u*38)*.22+pink*Math.exp(-u*30)*.6;}
      d[i]=v*pan;}}
  const s=AC.createBufferSource();s.buffer=b;s.playbackRate.value=.94+Math.random()*.12;
  const hp=AC.createBiquadFilter();hp.type="highpass";hp.frequency.value=180;
  const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=5200;
  const g=AC.createGain();g.gain.value=.32;
  s.connect(hp).connect(lp).connect(g).connect(AC.destination);s.start();}catch(e){}}

async function ingest(f){const st=$("#upS");st.textContent="Reading "+f.name+"…";let srcPages=[];
  try{if(/\.pdf$/i.test(f.name)||f.type==="application/pdf"){if(!window.pdfjsLib)throw new Error("PDF reader did not load");pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
      const doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;const n=Math.min(doc.numPages,300);for(let i=1;i<=n;i++){const p=await doc.getPage(i),tc=await p.getTextContent();srcPages.push(tc.items.map(x=>x.str+(x.hasEOL?"\n":" ")).join("").replace(/[ \t]+/g," ").trim());if(i%10===0)st.textContent=`Reading page ${i} of ${n}…`;}}

const ATTRS=["aria-label","placeholder","title"];
function trEl(el){ATTRS.forEach(a=>{if(!el.hasAttribute||!el.hasAttribute(a))return;const key="data-en-"+a;const raw=el.getAttribute(key)??el.getAttribute(a);const out=isAR()?AR_UI[raw]||AR_A[raw]:null;if(out){if(!el.hasAttribute(key))el.setAttribute(key,raw);if(el.getAttribute(a)!==out)el.setAttribute(a,out);}else if(el.hasAttribute(key)&&!isAR()){el.setAttribute(a,raw);}});}
const AR_A={"Library tools":"أدوات المكتبة","Book controls":"أدوات الكتاب","Table of contents":"المحتويات","Previous page":"الصفحة السابقة","Next page":"الصفحة التالية","Watch demo":"شاهد العرض","Pause demo":"إيقاف العرض","Bookmark this page":"أضف إشارة لهذه الصفحة","Reset camera view":"إعادة ضبط المنظر","More settings":"إعدادات إضافية","Sound":"الصوت","Night desk theme":"مكتب ليلي","Reduced motion":"تقليل الحركة","Zoom in":"تكبير","Zoom out":"تصغير","Fullscreen":"ملء الشاشة","Read page aloud":"اقرأ الصفحة بصوت عالٍ","Close panel":"إغلاق اللوحة","Close":"إغلاق","Reading view":"وضع القراءة","Ask the tutor":"اسأل المعلّم","Ask about this page…":"اسأل عن هذه الصفحة…","Your note…":"ملاحظتك…","Yellow highlight":"تظليل أصفر","Green highlight":"تظليل أخضر","Blue highlight":"تظليل أزرق","Add a note":"أضف ملاحظة","Read selection aloud":"اقرأ التحديد","Explain with AI":"اشرح بالذكاء الاصطناعي","Make a flashcard":"اصنع بطاقة","Flip card":"اقلب البطاقة","Selection tools":"أدوات التحديد","Settings":"الإعدادات","Exam centre":"مركز الاختبارات","Flashcards":"البطاقات","Notes and highlights":"الملاحظات والتظليل","AI tutor":"المعلّم الذكي","Progress and plan":"التقدّم والخطة","Library":"المكتبة","Filter rows":"تصفية","Listen to this page":"استمع إلى الصفحة","Web page view":"عرض صفحة الويب","Back to the 3D book":"العودة إلى الكتاب ثلاثي الأبعاد","Reading speed":"سرعة القراءة","Stop reading":"إيقاف القراءة","Pause":"إيقاف مؤقت","Previous page":"الصفحة السابقة","Next page":"الصفحة التالية","Figure explorer":"مستكشف المجسّمات","Switch to 2D view":"التبديل إلى منظر 2D","Switch to 3D view":"التبديل إلى منظر 3D","Viewing angles":"زوايا الرؤية","Projection":"الإسقاط","Figures":"المجسّمات"};
const CHROME="#topbar,#hud,#more,#views,#listenBar,#sign,#drawer,#sheet,#reader .grab,#toast,#loader,#caption,#seltb";
function trAll(root){const roots=root?[root]:$$(CHROME);roots.forEach(r=>{if(!r)return;const w=document.createTreeWalker(r,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){if(n.parentElement&&n.parentElement.closest(".qt,.qo,.fc,.msg,.note q,.vol .cover b,input,textarea"))continue;trNode(n);}[r,...r.querySelectorAll("*")].forEach(trEl);});}
let trBusy=false;const MO=new MutationObserver(ms=>{if(trBusy||!isAR())return;trBusy=true;try{ms.forEach(m=>{const t=m.target.nodeType===3?m.target.parentElement:m.target;if(t&&t.closest&&t.closest(CHROME))trAll(t.closest(CHROME));});}finally{trBusy=false;}});
function setLang(l){S.lang=l;save();const ar=l==="ar";document.documentElement.lang=ar?"ar":"en";document.documentElement.dir=ar?"rtl":"ltr";$("#langBtn").innerHTML=ar?'<span lang="en">EN</span>':'<span lang="ar">ع</span>';$("#langBtn").setAttribute("aria-label",ar?"Switch to English":"التبديل إلى العربية");$("#langBtn").title=ar?"Switch to English":"التبديل إلى العربية";
  trAll();stopWatch();clearDemo();renderSpread({reDemo:true});resetView();if(DRAWER)openDrawer(DRAWER);if(!$("#sheet").hidden){const t=$("#shT").textContent;closeSheet();}if(G.webOn)webJump();if(exploring()){setView("figure");markView();renderExplore();}toast(ar?"تم التبديل إلى العربية":"Switched to English");}

/* ---------- boot ---------- */
async function boot(){
  const bar=$("#ldbar"),msg=$("#ldmsg"),step=(p,m)=>{bar.style.width=p+"%";msg.textContent=m;};
  document.documentElement.dataset.rm=S.rm?"1":"0";document.documentElement.dataset.night=S.night?"1":"0";
  if(!window.THREE||!THREE.CSS3DRenderer||!THREE.OrbitControls||!window.gsap){step(100,"3D components could not load");$("#loader .box").insertAdjacentHTML("beforeend",`<p style="text-align:center">This view could not load the 3D book. Check your connection and reload.</p>`);return;}
  step(20,"Setting the type");try{await Promise.race([Promise.all(['600 46px "Crimson Pro"','400 25px "Source Serif 4"','500 15px "JetBrains Mono"','italic 600 46px "Crimson Pro"'].map(f=>document.fonts.load(f))),new Promise(r=>setTimeout(r,2500))]);}catch(e){}
  step(45,"Binding the book");
  try{initScene();}catch(e){console.error(e);step(100,"WebGL is unavailable");$("#loader .box").insertAdjacentHTML("beforeend",`<p style="text-align:center">This device or view can't start WebGL, which the 3D book needs.</p>`);return;}
  step(75,"Folding the pop-ups");
  if(S.vol!=="gisp"){DOC=await idbGet(S.vol);if(!DOC)S.vol="gisp";}
  wire();layoutMode();MO.observe(document.body,{subtree:true,childList:true,characterData:true});
  document.documentElement.lang=isAR()?"ar":"en";document.documentElement.dir=isAR()?"rtl":"ltr";$("#langBtn").innerHTML=isAR()?'<span lang="en">EN</span>':'<span lang="ar">ع</span>';
  renderSpread({reDemo:true});trAll();
  step(100,"Ready");setTimeout(()=>$("#loader").classList.add("done"),250);
}
boot();

</script>
