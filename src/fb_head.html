<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;500;600&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
/* Layout: a reading room — the 3D desk and open book fill the screen; ivory instrument chrome floats above it (top bar, bottom HUD, side drawer, full sheets). Light reading-room theme by default, night-desk theme on toggle. */
:root{
  color-scheme:light;
  --bg:#FAF8F3; --ivory:#F6F3EC; --paper:#F7F4EC; --ink:#161616; --text:#2A2A2A; --muted:#5C5C5C; --line:#E6E3DC; --line2:#CDC8BD;
  --navy:#10233F; --emerald:#0E6B4F; --teal:#0F766E; --gold:#9C7A2E; --gold-soft:#F6EFDD;
  --good:#17703C; --good-soft:#ECF6F0; --bad:#B42318; --bad-soft:#FCEFEC; --mark:#FFE58A; --mark2:#BFE8D4; --mark3:#C9DCF5;
  --glass:rgba(255,255,255,.88); --shadow:0 1px 2px rgba(16,35,63,.06),0 12px 32px -14px rgba(16,35,63,.22);
  --display:"Crimson Pro",Georgia,serif; --serif:"Source Serif 4",Georgia,serif; --ui:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
:root[data-night="1"]{--glass:rgba(16,24,38,.86);--bg:#0F1724;--ivory:#131D2C;--ink:#F2EFE8;--text:#DCD8CF;--muted:#A4AAB5;--line:#26324A;--line2:#3A4763;--gold-soft:#2A2516;--good-soft:#11291E;--bad-soft:#2E1714;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#E9E5DD;color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
:root[data-night="1"] body{background:#0B111B}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button[disabled]{cursor:not-allowed;opacity:.45}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--display);color:var(--ink);margin:0;font-weight:600;line-height:1.1;text-wrap:balance}
p{margin:0}

/* scene */
#scene{position:fixed;inset:0;z-index:1}
#scene canvas{display:block;position:absolute;inset:0;touch-action:none}
#css3d{position:absolute;inset:0;pointer-events:none;z-index:2}
#css3d .page{pointer-events:auto}
/* the CSS3D camera layer must stay LTR: in RTL documents absolutely-positioned children anchor to the right edge */
#css3d,#css3d>div,#css3d>div>div{direction:ltr}

/* loader */
#loader{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--ivory);transition:opacity .6s}
#loader.done{opacity:0;pointer-events:none}
#loader .box{display:flex;flex-direction:column;align-items:center;gap:18px;width:min(320px,80vw)}
#loader h1{font-size:34px}
#loader .bar{width:100%;height:2px;background:var(--line)}
#loader .bar i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}

/* chrome */
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px}
#topbar{position:fixed;z-index:20;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:10px;pointer-events:none}
#topbar > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px}
.brand b{font-family:var(--display);font-size:21px;color:var(--ink);line-height:1}
.brand span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tools{display:flex;gap:2px;padding:4px;flex-wrap:wrap;justify-content:flex-end}
.tb{display:inline-flex;align-items:center;gap:7px;min-height:40px;min-width:40px;justify-content:center;padding:6px 12px;border:0;background:transparent;border-radius:8px;color:var(--ink);font-weight:700;font-size:14px;transition:background .18s}
.tb:hover{background:rgba(16,35,63,.07)}
:root[data-night="1"] .tb:hover{background:rgba(255,255,255,.08)}
.tb.on{background:var(--ink);color:var(--bg)}
.tb .t{white-space:nowrap}
@media (max-width:1100px){.tools .tb .t{display:none}.tools .tb{padding:6px 10px}}
#topbar .brand{flex:none}#topbar .tools{min-width:0}
@media (max-width:600px){.brand{padding:6px 8px}.brand>div{display:none}.tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;justify-content:flex-start;margin-inline-start:auto}.tools::-webkit-scrollbar{display:none}.tools .tb{min-width:36px;padding:6px 7px;flex:none}}

#hud{position:fixed;z-index:20;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:4px;padding:6px;max-width:calc(100vw - 24px)}
#hud .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
#hud .now{display:flex;flex-direction:column;gap:5px;min-width:200px;max-width:280px;padding:0 10px}
#hud .now b{font-family:var(--display);font-size:16px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
#hud .prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
#hud .prog i{display:block;height:100%;background:var(--emerald);transition:width .4s}
#hud .now small{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.06em}
#hud .tb{min-width:40px;padding:6px 9px}
#more .narrow{display:none}
@media (max-width:980px){#more .narrow{display:inline-flex}#hud .opt{display:none}#hud .now{min-width:120px;max-width:180px}}
@media (max-width:560px){#hud{left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));transform:none;justify-content:space-between;max-width:none}#hud .now{min-width:0;flex:1;padding:0 4px}#hud .sep{display:none}#hud{gap:2px;padding:5px}#hud .tb{min-width:34px;padding:6px 5px}#hud .now small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#hRead{display:none!important}.tb.dim{padding:3px}.tb.dim span{padding:4px 5px}}
#more{position:fixed;z-index:21;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;justify-content:center;gap:2px;padding:6px;max-width:calc(100vw - 24px)}
#caption{position:fixed;z-index:19;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100vw - 32px));padding:14px 18px;display:flex;gap:14px;align-items:flex-start}
#caption .n{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.1em;padding-top:4px;white-space:nowrap}
#caption h3{font-size:20px;margin-bottom:2px}
#caption p{font-size:14.5px;color:var(--text)}

/* the printed page (CSS3D + compact reader share it) */
.page{width:600px;height:792px;padding:48px 44px 40px 50px;font-family:var(--serif);font-size:15.5px;line-height:1.6;font-optical-sizing:auto;font-kerning:normal;font-variant-ligatures:common-ligatures;color:#1C1A17;overflow:hidden;position:relative;background:transparent}
.page.right{padding:48px 50px 40px 44px}
/* curved-paper gutter shading so the printed text sits *in* the page */
.page::after{content:"";position:absolute;top:0;bottom:0;width:70px;pointer-events:none}
.page[data-side="left"]::after{right:0;background:linear-gradient(to left,rgba(70,52,24,.13),rgba(70,52,24,0))}
.page[data-side="right"]::after{left:0;background:linear-gradient(to right,rgba(70,52,24,.13),rgba(70,52,24,0))}
#reader .page::after{display:none}
.page .opt.no{animation:nope .4s}
@keyframes nope{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.page .opt.ok{animation:yes .5s}
@keyframes yes{40%{transform:scale(1.025)}}
/* Arabic edition */
:root[dir="rtl"]{--display:"Amiri","Noto Naskh Arabic",serif;--ui:"IBM Plex Sans Arabic","Atkinson Hyperlegible",sans-serif}
:root[dir="rtl"] body{font-size:15.5px}
.page[dir="rtl"]{font-family:"Noto Naskh Arabic","Amiri",serif;font-size:16px;line-height:1.75;padding:42px 48px 36px 44px;text-align:right}
.page[dir="rtl"] h1{font-family:"Amiri",serif;font-size:36px;line-height:1.3;letter-spacing:0;font-weight:700}
.page[dir="rtl"] h2{font-family:"Amiri",serif;font-size:24px;font-weight:700}
.page[dir="rtl"] .q{font-family:"Noto Naskh Arabic",serif;font-size:17px;font-weight:600;line-height:1.6}
.page[dir="rtl"] .opt{font-family:"Noto Naskh Arabic",serif;font-size:14.5px;padding:5px 10px}
.page[dir="rtl"] dt{font-family:"Noto Naskh Arabic",serif;font-size:14.5px;font-weight:700}
.page[dir="rtl"] dd{font-size:14px}
.page[dir="rtl"] .run,.page[dir="rtl"] .kicker,.page[dir="rtl"] .ksa{font-family:"IBM Plex Sans Arabic",var(--mono);letter-spacing:0;text-transform:none}
.page[dir="rtl"] .run{font-size:11px}.page[dir="rtl"] .kicker{font-size:12px}
.page[dir="rtl"] p:first-of-type::first-letter{all:unset}
.page[dir="rtl"] .formula code{direction:ltr;unicode-bidi:isolate;text-align:right}
.page[dir="rtl"] .tools{right:auto;left:42px}
.page[dir="rtl"] .stamp{right:auto;left:46px;transform:rotate(14deg) scale(1.25)}
.page[dir="rtl"] .stamp.on{transform:rotate(14deg) scale(1)}
.page[dir="rtl"] .stamp b{font-family:"Amiri",serif}
.page[dir="rtl"] .flap{font-family:"Amiri",serif;font-size:18px}
#reader .page[dir="rtl"] .tools{position:static}
#reader .page[dir="rtl"] .stamp{margin:10px auto 0 0}
[dir="rtl"] #hPrev svg,[dir="rtl"] #hNext svg,[dir="rtl"] .btn svg.i[data-dir],[dir="rtl"] #xP svg,[dir="rtl"] #xN svg{transform:scaleX(-1)}
[dir="rtl"] .label,[dir="rtl"] .field{letter-spacing:0;text-transform:none}
[dir="rtl"] #drawer{right:auto;left:max(12px,env(safe-area-inset-left,0px))}
[dir="rtl"] .bars .b{direction:rtl}
/* 2D / 3D toggle */
.tb.dim{gap:0;padding:4px;border:1px solid var(--line2);font-family:var(--mono);font-size:12px;font-weight:600}
.tb.dim span{padding:4px 7px;border-radius:6px;color:var(--muted)}
.tb.dim .d3{background:var(--ink);color:var(--bg)}
.tb.dim[aria-pressed="true"] .d3{background:none;color:var(--muted)}.tb.dim[aria-pressed="true"] .d2{background:var(--ink);color:var(--bg)}
/* viewing angles */
#views{position:fixed;z-index:21;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:14px;display:flex;flex-direction:column;gap:10px;width:min(440px,calc(100vw - 24px))}
.vgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.vb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 8px;min-height:64px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:12.5px;font-weight:700;transition:border-color .15s,background .15s,transform .15s}
.vb:hover{border-color:var(--ink);transform:translateY(-1px)}
.vb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vb svg{width:40px;height:28px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#views .seg{width:100%}#views .seg button{flex:1}
/* figure explorer (left list · centre model · right info) */
#explore{position:fixed;inset:0;z-index:15;pointer-events:none}
#exList{position:absolute;top:calc(74px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:216px;padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#exInfo{position:absolute;top:calc(74px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:320px;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;pointer-events:auto}
.fig{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:8px;border:1px solid var(--line);border-radius:12px;background:var(--bg);transition:border-color .15s,box-shadow .15s,transform .15s}
.fig:hover{border-color:var(--line2);transform:translateX(2px)}
.fig.on{border-color:var(--ink);box-shadow:var(--shadow)}
.fig .th{width:52px;height:52px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(160deg,#F4F1EA,#E7EDF3);color:var(--navy)}
:root[data-night="1"] .fig .th{background:linear-gradient(160deg,#1D2A3D,#152031);color:#CFE0F2}
.fig .th svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.fig b{display:block;font-family:var(--display);font-size:16px;color:var(--ink);line-height:1.15}
.fig small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.fig .done{color:var(--good);font-size:11px;font-weight:700}
#exInfo>*{flex-shrink:0}#exList>*{flex-shrink:0}
#exInfo h2{font-size:34px;line-height:1.05}
#exInfo .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:10px}
#exInfo .stats div{padding:10px;border-right:1px solid var(--line)}#exInfo .stats div:last-child{border-right:0}
[dir="rtl"] #exInfo .stats div{border-right:0;border-left:1px solid var(--line)}[dir="rtl"] #exInfo .stats div:last-child{border-left:0}
#exInfo .stats b{display:block;font-family:var(--display);font-size:22px;color:var(--ink)}
#exInfo .stats span{font-size:11.5px;color:var(--muted)}
.stepl{display:flex;flex-direction:column;gap:6px}
.stepl button{display:grid;grid-template-columns:28px minmax(0,1fr) 18px;gap:10px;align-items:start;text-align:start;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);transition:border-color .15s,background .15s}
.stepl button:hover{border-color:var(--line2)}
.stepl button.on{border-color:var(--ink);background:var(--ivory)}
.stepl .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ivory);border:1px solid var(--line2);font-family:var(--mono);font-size:12px;color:var(--ink)}
.stepl button.on .n{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stepl b{display:block;color:var(--ink);font-size:14.5px}.stepl small{display:block;font-size:13px;color:var(--muted);line-height:1.45}
.stepl .ok{color:var(--good);font-size:13px}
#exInfo code{font-family:var(--mono);font-size:13.5px;color:var(--navy);direction:ltr;unicode-bidi:isolate}
:root[data-night="1"] #exInfo code{color:#BFD6EE}
[dir="rtl"] #exList{left:auto;right:max(12px,env(safe-area-inset-right,0px))}
[dir="rtl"] #exInfo{right:auto;left:max(12px,env(safe-area-inset-left,0px))}
[dir="rtl"] .fig{text-align:right}
body.exploring #reader,body.exploring #caption{display:none!important}
@media (max-width:900px){
  #exList{top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;height:84px;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px}
  .fig{grid-template-columns:44px auto;min-width:170px;padding:6px}.fig .th{width:44px;height:44px}
  #exInfo{top:auto;bottom:calc(168px + env(safe-area-inset-bottom,0px));left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;max-height:34vh;padding:14px}
  #exInfo h2{font-size:24px}
  [dir="rtl"] #exList,[dir="rtl"] #exInfo{left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px))}
}
.tb.lang{font-weight:700;border:1px solid var(--line2);padding:6px 14px}
.tb.lang span[lang="ar"]{font-family:"IBM Plex Sans Arabic",sans-serif;font-size:15px}
@media (max-width:1100px){.tools .tb.lang{padding:6px 10px}}
.page .run{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#6B6458;border-bottom:1px solid rgba(28,26,23,.18);padding-bottom:8px;margin-bottom:22px}
.page h1{font-family:var(--display);font-size:38px;line-height:1.02;color:#151311;margin:2px 0 14px;letter-spacing:-.01em}
.page h2{font-family:var(--display);font-size:24px;color:#151311;margin:0 0 10px}
.page .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7A5E1F}
.page p{margin:0 0 10px;text-wrap:pretty;hyphens:auto}
.page p:first-of-type::first-letter{font-family:var(--display);font-size:3.1em;float:left;line-height:.82;padding:4px 6px 0 0;color:#10233F}
.page .nodrop::first-letter{all:unset}
.page .formula{margin:14px 0 6px;border-top:1.5px solid #151311;border-bottom:1px solid rgba(28,26,23,.25);padding:10px 0;display:flex;flex-direction:column;gap:8px}
.page .formula div{display:flex;flex-direction:column}
.page .formula code{font-family:var(--mono);font-size:14.5px;color:#10233F;font-weight:600}
.page .formula span{font-size:12.5px;color:#5E574C;font-style:italic}
.page .ksa{font-family:var(--mono);font-size:10px;color:#6B6458;margin-top:12px;letter-spacing:.04em}
.page dl{margin:0 0 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.page dt{font-family:var(--display);font-weight:700;font-size:16px;color:#151311}
.page dd{margin:0;font-size:13.5px;color:#3A352E}
.page .q{font-family:var(--display);font-size:19px;font-weight:600;color:#151311;line-height:1.2;margin-bottom:8px}
.page .opts{display:grid;gap:6px}
.page .opt{display:flex;gap:10px;align-items:flex-start;text-align:left;font-family:var(--serif);font-size:14px;padding:7px 10px;border:1px solid rgba(28,26,23,.28);border-radius:4px;background:rgba(255,255,255,.35);color:#1C1A17;transition:background .15s,border-color .15s}
.page .opt:hover:not([disabled]){border-color:#151311;background:rgba(255,255,255,.7)}
.page .opt b{font-family:var(--mono);font-size:12px;color:#6B6458}
.page .opt.ok{border-color:#17703C;background:rgba(23,112,60,.12)}
.page .opt.no{border-color:#B42318;background:rgba(180,35,24,.10)}
.page .opt[disabled]{cursor:default}
.flapwrap{position:relative;margin-top:12px;min-height:96px;perspective:900px}
.flapwrap .under{padding:12px 14px;border:1px dashed rgba(28,26,23,.3);border-radius:4px;font-size:13.5px;background:rgba(255,255,255,.3)}
.flapwrap .under b{color:#17703C}
.flap{position:absolute;inset:0;transform-origin:top center;transition:transform .9s cubic-bezier(.3,.7,.2,1);background:#EFE6CF;border:1px solid rgba(28,26,23,.25);border-radius:4px;display:flex;align-items:center;justify-content:center;gap:10px;font-family:var(--display);font-size:17px;color:#5E4A1C;box-shadow:0 2px 0 rgba(28,26,23,.12);backface-visibility:hidden}
.flap::after{content:"";position:absolute;right:10px;bottom:8px;width:22px;height:22px;background:linear-gradient(135deg,transparent 50%,#D9CBA6 50%);border-radius:0 0 3px 0}
.flap.up{transform:rotateX(-172deg)}
.flap.locked{cursor:not-allowed}

:root[data-night="1"] .wstage{background:radial-gradient(120% 90% at 50% 35%,#1A2638,#111A28)}
.wstage canvas{display:block;width:100%;height:100%;cursor:grab}.wstage canvas:active{cursor:grabbing}
.wload{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 22px;border:1px dashed var(--line2);border-radius:14px;background:color-mix(in srgb,var(--bg) 80%,transparent);color:var(--ink);font-weight:700;font-size:14.5px}
.wload svg{width:54px;height:54px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;color:var(--navy)}
.wfig.live .wload{display:none}
.whint{position:absolute;left:14px;bottom:12px;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted);pointer-events:none;opacity:0;transition:opacity .3s}
[dir="rtl"] .whint{left:auto;right:14px}.wfig.live .whint{opacity:1}
.wfig figcaption{padding:14px 16px 16px;border-top:1px solid var(--line);background:var(--bg)}
.whead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.whead b{font-family:var(--display);font-size:21px;color:var(--ink);font-style:italic}
.whead span{display:flex;gap:4px}
.wbtn{min-width:36px;height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:9px;background:var(--bg);color:var(--ink);font-weight:700;font-size:14px}
.wbtn:hover{border-color:var(--ink)}.wbtn.play{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wsteps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.wsteps li{margin:0!important}
.wsteps button{width:100%;height:100%;display:grid;grid-template-columns:26px minmax(0,1fr) 14px;gap:9px;align-items:start;text-align:start;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
.wsteps button:hover{border-color:var(--line2)}
.wsteps button.on{border-color:var(--ink);background:var(--ivory);box-shadow:inset 0 0 0 1px var(--ink)}
.wsteps .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);font-family:var(--mono);font-size:12px;color:var(--ink)}
.wsteps button.on .n{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wsteps b{display:block;font-size:15px;color:var(--ink);line-height:1.3}.wsteps small{display:block;font-size:13.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.wsteps .ok{color:var(--good);font-size:13px}
@media (max-width:600px){.wstage{height:min(340px,48vh)}.wsteps{grid-template-columns:1fr}}

/* author signature: small, bottom-right corner */
#sign{position:fixed;z-index:19;left:max(14px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column-reverse;align-items:flex-start;gap:8px;direction:ltr;pointer-events:none}
#sign .cr{font:italic 400 14px/1.3 "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--muted);letter-spacing:.01em}
#sign .cr b{font-weight:700;color:var(--text)}
#sign .soc{display:flex;gap:8px;pointer-events:auto}
#sign .soc a{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);background:color-mix(in srgb,var(--bg) 82%,transparent);color:var(--ink);transition:transform .15s,background .15s,color .15s,border-color .15s}
#sign .soc a:hover,#sign .soc a:focus-visible{background:var(--ink);color:var(--bg);border-color:var(--ink);transform:translateY(-2px)}
#sign .soc svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
body.web #sign{bottom:calc(12px + env(safe-area-inset-bottom,0px))}
/* phones and tablets: the corner signature moves into the reading panel and the web page, so it never covers the book */
body.compact #sign,body.web #sign{display:none}
@media (max-width:1199px){#sign .cr span{display:none}}
.sign-inline{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin:28px 0 8px;padding-top:16px;border-top:1px solid var(--line)}
[dir="rtl"] .sign-inline{align-items:flex-end}
.sign-inline .cr{font:italic 400 13.5px/1.3 "Atkinson Hyperlegible",system-ui,sans-serif;color:var(--muted)}
.sign-inline .cr b{font-weight:700;color:var(--text)}
.sign-inline .soc{display:flex;gap:8px}
.sign-inline .soc a{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);background:var(--bg);color:var(--ink)}
.sign-inline .soc a:hover,.sign-inline .soc a:focus-visible{background:var(--ink);color:var(--bg)}
.sign-inline .soc svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round}
#web .sign-inline{grid-column:1/-1;max-width:760px;width:100%;justify-self:center}
[dir="rtl"] #sign .cr{direction:rtl;unicode-bidi:isolate}
@media print{#sign{display:none}}

/* closed book */
#openHint{position:fixed;z-index:18;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:11px 18px;border-radius:999px;border:1px solid var(--line2);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);color:var(--ink);font-weight:700;font-size:14.5px;box-shadow:var(--shadow)}
#openHint .dot{width:9px;height:9px;border-radius:50%;background:#C9A045;box-shadow:0 0 0 0 rgba(201,160,69,.6);animation:oh 1.8s ease-out infinite}
@keyframes oh{0%{box-shadow:0 0 0 0 rgba(201,160,69,.55)}100%{box-shadow:0 0 0 14px rgba(201,160,69,0)}}
@media (prefers-reduced-motion:reduce){#openHint .dot{animation:none}}
body.closed #openHint{display:inline-flex}
body.closed #reader,body.closed #caption,body.closed .edge{display:none!important}
body.closed #scene canvas{cursor:pointer}
body.web #openHint{display:none!important}
